<div class="wrapper profile custom-mat-css">
    <div class="title themeheading">
        {{title}}<a class="btn btn-primary float-right">Edit</a><span class="clearfix"></span>
    </div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-6">
                <div class="input-group">
                    <input type="text" class="custom-field">
                    <label for="">First Name</label>
                </div>
            </div>
            <div class="col-md-6">
              <div class="input-group">
                  <input type="text" class="custom-field">
                  <label for="">Last Name</label>
              </div>
          </div>
        </div>
        <div class="row">
          <div class="col-md-6">
              <div class="input-group">
                  <input type="text" class="custom-field">
                  <label for="">Mobile Number</label>
              </div>
          </div>
          <div class="col-md-6">
            <div class="input-group">
                <input type="text" class="custom-field">
                <label for="">Email Id</label>
            </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6">
            <div class="input-group">
                <input type="text" class="custom-field">
                <label for="">House No.</label>
            </div>
        </div>
        <div class="col-md-6">
          <div class="input-group">
              <input type="text" class="custom-field">
              <label for="">Street name/cross</label>
          </div>
      </div>
    </div>

    <div class="row">
      <div class="col-md-6">
          <div class="input-group">
              <input type="text" class="custom-field">
              <label for="">Main</label>
          </div>
      </div>
      <div class="col-md-6">
        <div class="input-group">
            <input type="text" class="custom-field">
            <label for="">District</label>
        </div>
    </div>
  </div>
  <div class="row">
    <div class="col-md-6">
        <div class="input-group">
            <input type="text" class="custom-field">
            <label for="">State</label>
        </div>
    </div>
    <div class="col-md-6">
      <div class="input-group">
          <input type="text" class="custom-field">
          <label for="">Pincode</label>
      </div>
  </div>
</div>
  </div>

  <div class="btn-wrapper text-center">
      <button class="btn btn-primary">Save</button>
      <button class="btn btn-primary">Cancel</button>
  </div>

</div>
