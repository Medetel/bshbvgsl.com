<div class="title themeheading">

    {{title}}
    <div class="float-right">
        Items per page:
        <select >
            <option [ngValue]="5">5</option>
            <option [ngValue]="10">10</option>
            <option value="20">20</option>
            <option value="30">30</option>
            <option value="40">40</option>
            <option value="50">50</option>
        </select>
        <!-- <a class="btn btn-primary " routerLink="/home/officeform">Add Office</a> -->
    </div>
    <span class="clearfix"></span>
</div>

<div class="wrapper">
    <form #searchForm="ngForm">
        <div class="searchbar">
            <div class="container">
                <div class="row">
                    <div class="col-md-1">
                        <label>Search</label>
                    </div>
                    <div class="col-md-4">
                        <select class="form-control" name="SearchCriteria" #SearchCriteria="ngModel" [(ngModel)]="s.SearchCriteria" required>
                            <option [ngValue]="undefined" selected>---Select---</option>
                            <option value="office-code">Notification No.</option>
                            <option value="office-name">Notification Date</option>
                        </select>
                        <!-- <div *ngIf="SearchCriteria.invalid && (SearchCriteria.dirty || SearchCriteria.touched)" class="error-msg">
                              <div *ngIf="SearchCriteria.errors.required">Search criteria is required</div>
                          </div> -->
                    </div>
                    <div class="col-md-4">
                        <input type="text" name="SearchText" #SearchText="ngModel" [(ngModel)]="s.SearchText" class="form-control" placeholder="Search.." required>
                        <!-- <div *ngIf="SearchText.invalid && (SearchText.dirty || SearchText.touched)" class="error-msg">
                              <div *ngIf="SearchText.errors.required">Search text is required</div>
                          </div> -->
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-default" type="submit">Search</button>
                        <button class="btn btn-default" type="reset" (click)="GetAllNotificationList(itemsPerPage, 1)">Clear</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-striped grid"> 
                <thead>
                    <tr>
                        <td>Sl No.</td>
                        <td>Notification No.</td>
                        <td>Notification Date</td>
                        <td>Project</td>
                        <td>View Notification</td>
                        <td>Apply Now</td>
                        <!-- <td>Bank Reference No.</td> -->
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let noti of notificationlist | paginate: { id: 'pagination',itemsPerPage: itemsPerPage,currentPage: currentPage,totalItems: totalItems }; let i=index"
                    >
                        <td>{{((currentPage-1)*itemsPerPage)+(i+1)}}.</td>
                        <td>{{noti.DSWOId_NO_Number}}</td>
                        <td>{{noti.DSWOId_NO_Date | date:'dd-MM-yyyy'}}</td>
                        <td>{{noti.PD_Project_Name}}</td>
                        <td>
                            <a href="#">View</a>
                        </td>
                        <td>
                            <button class="btn btn-primary" type="button" [routerLink]="['/home/apply/application-form',noti.DSWOId_NO_Id]">Apply Now</button>
                        </td>
                        <!-- <td><button class="btn btn-primary" type="button">Bank Reference No</button></td> -->
                    </tr>
                </tbody>
            </table>
            <!-- <div class="container-fluid">
                <div class="row">
                    <div class="col-md-11">
                        <pagination-controls class="my-pagination" id="pagination" (pageChange)="pageChanged($event)" maxSize="9" directionLinks="true"
                            autoHide="false" previousLabel="Previous" nextLabel="Next" screenReaderPaginationLabel="Pagination"
                            screenReaderPageLabel="page" screenReaderCurrentLabel="You're on page">
                        </pagination-controls>
                    </div>
                    <div class="col-md-1">
                        Total:
                        <span>{{totalItems}}</span>
                    </div>
                </div>
            </div> -->
        </div>
    </form>
</div>
