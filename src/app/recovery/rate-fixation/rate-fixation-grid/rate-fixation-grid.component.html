
<div class="wrapper">
  <div class="title themeheading">

            <option [ngValue]="5">5</option>
            <option [ngValue]="10">10</option>

            <option value="30">30</option>
            <option value="40">40</option>

        <div class="col-md-3">
          <button class="btn btn-primary">Search</button> &nbsp;

      </div>
