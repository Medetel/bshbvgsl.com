<div class="wrapper">
  <div class="title themeheading">
    View Renewal
    <button class="btn btn-primary float-right" [routerLink]="['/home/Renewals']"
      routerLinkActive="active">Back</button>
    <span class="" clearfix></span>
  </div>

  <div class="add-click container-fluid">
    <div class="row">
      <div class="col-md-4">
        <div class="input-group">
          <label> Project Code </label>
          <select name="" id="" class="custom-field">
            <option value="">--Select--</option>
          </select>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-4">
        <label> Project Name : </label>
      </div>
      <div class="col-md-4">
        <label> Scheme :</label>
      </div>
      <div class="col-md-4">
        <label> District :</label>
      </div>
    </div>

    <div class="row">
      <div class="col-md-2">
        <label style="color: blue;"> Agreement Type :</label>
      </div>
      <div class="col-md-4">
        <div class="form-check-inline">
          <label class="form-check-label" for="radio1">
            <input type="radio" class="form-check-input" id="radio1" name="optradio" value="option1">Lease
          </label>
        </div>
        <div class="form-check-inline">
          <label class="form-check-label" for="radio2">
            <input type="radio" class="form-check-input" id="radio2" name="optradio" value="option2">Rent
          </label>
        </div>
      </div>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-striped">
      <thead class="thead">
        <tr>


          <td>Sl.No</td>
          <td>Agreement No.</td>
          <td>Agreement Date</td>
          <td>Lessee Name</td>
          <td>Property Details</td>
          <td>Renewal Date</td>
          <td class="text-center">View</td>
          <td class="text-center">Edit</td>
          <td class="text-center">Delete</td>

        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td class="text-center">
            <a href="javascript:void(0);">
              <i class="fa fa-lg fa-eye themecolor"></i>
            </a>
          </td>
          <td class="text-center">
            <a href="javascript:void(0);">
              <i class="fa fa-lg fa-edit themecolor"></i>
            </a>
          </td>
          <td class="text-center">
            <a href="javascript:void(0);">
              <i class="fa fa-lg fa-trash themecolor"></i>
            </a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <br>

  <div class=" d-flex justify-content-center">
    <button class="btn btn-primary "> Save </button> &nbsp;
    <button class="btn btn-primary"> Cancel </button>
  </div>

</div>
