<div class="wrapper">
  <div class="title themeheading">
    Dividend Calculation
    <!-- <button class="btn btn-primary float-right" [routerLink]="['/home/customer-master']">Back</button> -->
    <span class="" clearfix></span>
  </div>
  <br>
  <form>
    <div class="add-click container-fluid">
      <div class="selector" id="app-filter">
        <div class="row justify-content-center">
          <div class="col-md-4">
            <div class="form-group input-group">
              <input class="custom-field" type="text">
              <label for="">Allotment Order number:</label>
            </div>
          </div>
          <div class="col-md-4">
            <div class="input-group">
              <input class="custom-field" type="text">
              <label for="">Allotment Date
                <span class="mandatory">*</span>
              </label>
            </div>
          </div>
          <div class="col-md-4">
            <button class="btn btn-primary" type="submit">Go</button>
          </div>
        </div>
      </div>
      <!-- <div class="col-md-6">
       
      </div> -->

      <div class="row">
        <div class="col-md-6">
          <div class="input-group">
            <label>Property Type
              <!-- <span>{{applicant.APP_PA_Name}}</span> -->
            </label>
            <input class="custom-field" type="text">

          </div>
        </div>
        <div class="col-md-6">
          <div class="input-group">
            <label> Land Area</label>
            <input class="custom-field" type="text">
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6">
          <div class="input-group">
            <label>Revised Cost of Plot(House/Flat)%</label>
            <input class="custom-field" type="text">
          </div>
        </div>
        <div class="col-md-6">
          <div class="input-group">
            <label>Rs.as on</label>
            <input type="date" class="custom-field">@
            <input class="custom-field" type="text">
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6">
          <div class="input-group">
            <label>Road Width</label>
            <input class="custom-field" type="text">
          </div>
        </div>
        <div class="col-md-6">
          <div class="input-group">
            <label> Sale Purchase Cost</label>
            <input class="custom-field" type="text">Rs.
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6">
          <div class="input-group">
            <label>Market Price</label>
            <input class="custom-field" type="text">Rs.
          </div>
        </div>
        <div class="col-md-6">
          <div class="input-group">
            <label>Extra Land Price</label>
            <input class="custom-field" type="text">Rs.
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6">
          <div class="input-group">
            <label> Deposit Amount (Extra Land)</label>
            <input class="custom-field" type="text">Rs.
          </div>
        </div>
        <div class="col-md-6">
          <div class="input-group">
            <label>Difference Amount(If any)</label>
            <input class="custom-field" type="text">Rs.
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6">
          <div class="input-group">
            <label>Balance Amount</label>
            <input class="custom-field" type="text">Rs.(Monthly)
            <input class="custom-field" type="text">Rs.(Quaterly)
          </div>
        </div>
        <div class="col-md-6">
          <div class="input-group">
            <label>Per Install Amount</label>
            <input class="custom-field" type="text">Rs.(Monthly)
            <input class="custom-field" type="text">Rs.(Quaterly)
          </div>
        </div>
      </div>
      <!-- <div class="row">
          <div class="col-md-6">
            <div class="input-group">
              <label>Earnest Money Along With Application</label>
              <input class="custom-field" type="text">
            </div>
          </div>
          <div class="col-md-6">
            <div class="input-group">
              <input type="date" class="custom-field">
              <label for=""> Date of Payment
                <span class="mandatory">*</span>
              </label>
            </div>
          </div>
        </div> -->
      <div class="row">
        <div class="col-md-6">
          <div class="input-group">
            <label>Total Installment</label>
            <input class="custom-field" type="text">Rs.(Monthly)
            <input class="custom-field" type="text">Rs.(Quaterly)
          </div>
        </div>
        <div class="col-md-6">
        <div class="input-group">
          <label for="">Normal Interest Rate</label>
          <input class="custom-field" type="text">%
        </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <div class="input-group">
            <label>Total Dues</label>
            <input class="custom-field" type="text">Rs.
          </div>
        </div>
        <div class="col-md-6">
          <div class="input-group">
            <label>Difference Revised Amount</label>
            <input class="custom-field" type="text">Rs.
          </div>
        </div>
      </div>
    </div>
   
   
    
    <br>

    <div class="d-flex justify-content-center">
      <button class="btn btn-primary"> Save
      </button> &nbsp;
      <button class="btn btn-primary"> Cancel </button>
    </div>
  </form>
</div>
