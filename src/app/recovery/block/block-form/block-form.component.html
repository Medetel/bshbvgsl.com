<div class="wraper">

  <div class="title themeheading">
    Add Block
    <button class="btn btn-primary float-right" [routerLink]="['/home/block']">Back</button>
    <span class="" clearfix></span>
  </div>

  <div class="add-click container-fluid">
    <div class="row">
      <div class="col-md-6">
        <div class="input-group">
          <label> Division Code </label>
          <select class="custom-field">
            <option value=""> --Select-- </option>
          </select>
        </div>
      </div>
      <div class="col-md-6">
        <div class="input-group">
          <label> Project Name </label>
          <select class="custom-field">
            <option value=""> --Select-- </option>

          </select>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="input-group">
          <label> Property Type </label>
          <input type="text" class="custom-field">
        </div>
      </div>
      <div class="col-md-6">
        <div class="input-group">
          <label> Block Code </label>
          <input type="text" class="custom-field">
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="input-group">
          <label> Block </label>
          <input type="text" class="custom-field">
        </div>
      </div>
      <div class="col-md-6">
        <div class="input-group">
          <label> Block Name </label>
          <input type="text" class="custom-field">
        </div>
      </div>

    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="input-group">
          <label> Status </label>
          <select class="custom-field">
            <option value=""> --Select-- </option>
            <option> Active </option>
            <option> Inactive </option>
          </select>
        </div>
      </div>
      <div class="col-md-6">

        <label style="color:blue;"> Multiple Buildings </label>
        <div class="form-check-inline">
          <label class="form-check-label" for="Yes">
            <input type="radio" class="form-check-input" id="Yes" name="optradio" value="Yes">Yes
          </label>
        </div>
        <div class="form-check-inline">
          <label class="form-check-label" for="No">
            <input type="radio" class="form-check-input" id="No" name="optradio" value="No">No
          </label>
        </div>

      </div>

    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="input-group">
          <label> Total Buildings</label>
          <input class="custom-field" type="text">
        </div>
      </div>
      <div class="col-md-6">
        <div class="input-group">
          <label> Property Area</label>
          <input class="custom-field" type="text">
        </div>
      </div>

    </div>

    <div class="row">
      <div class="col-md-12 d-flex justify-content-center">
        <button class="btn btn-primary "> Save </button> &nbsp;
        <button class="btn btn-primary"> Cancel </button>
      </div>
    </div>
  </div>
</div>
