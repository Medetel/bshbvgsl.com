<div class="wrapper">
  <div class="title themeheading">
    Add Building Details
    <button class="btn btn-primary float-right" [routerLink]="['/home/buildingdetails']">Back</button>
    <span class="clearfix"></span>
  </div>

  <div class="add-click container-fluid">
    <div class="row">
      <div class="col-md-6">
        <div class="input-group">
          <label> Division Code </label>
          <select name="" id="" class="custom-field">
            <option value="">--Select--</option>
          </select>
        </div>
      </div>
      <div class="col-md-6">
        <div class="input-group">
          <label> Project Name </label>
          <select name="" id="" class="custom-field">
            <option value="">--Select--</option>
          </select>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="input-group">
          <label> Block Name </label>
          <select name="" id="" class="custom-field">
            <option value="">--Select--</option>
          </select>
        </div>
      </div>
      <div class="col-md-6">
        <div class="input-group">
          <label> Property Type </label>
          <select name="" id="" class="custom-field">
            <option value="">--Select--</option>
            <option value="">Building</option>
          </select>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="input-group">
          <label> Building Code </label>
          <input class="form-control" type="text">
        </div>
      </div>
      <div class="col-md-6">
        <div class="input-group">
          <label> Building Name </label>
          <input class="form-control" type="text">
        </div>

      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="input-group">
          <label>Status </label>
          <select class="form-control">
            <option value=""> --Select--  </option>
            <option> Active </option>
            <option> Inactive </option>
          </select>
        </div>
      </div>
      <div class="col-md-6">        
          <label style="color:blue;" > Multiple Floors  </label>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio1" value="option1">
            <label class="form-check-label" for="inlineRadio1">Yes</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio2" value="option2">
            <label class="form-check-label" for="inlineRadio2">No</label>
          </div>       

      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="input-group">
          <label> Total Floors </label>
          <input class="form-control" type="number" />
        </div>
      </div>
      <div class="col-md-6">
        <div class="input-group">
          <label>Property Area </label>
          <input class="form-control" type="text" />
        </div>
      </div>
    </div>   

    <div class="row">
      <div class="col-md-12 d-flex justify-content-center">
        <button class="btn btn-primary "> Save </button> &nbsp;
        <button class="btn btn-primary"> Cancel </button>
      </div>
    </div>
  </div>
</div>
