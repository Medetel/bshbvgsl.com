<div class="wrapper">
  <div class="title themeheading">
    Add Property
    <button class="btn btn-primary float-right" [routerLink]="['/home/property-recovery']">Back</button>
    <span class="" clearfix></span>
  </div>
  <form (ngSubmit)="mode=='Edit'?UpdateCustomer(Customer):CreateCustomer(Customer)" #RecoveryProperty="ngForm">
    <div class="add-click container-fluid">
      <div class="row">
        <div class="col-md-6">
          <div class="input-group">
            <label for=""> Project Name <span style="color:red;"> *</span>
            </label>
            <select class="custom-field" [(ngModel)]="P.PR_PD_ID" #PR_PD_ID="ngModel"
              name="PR_PD_ID" [disabled]="mode=='View'" required>
              <option [value]="undefined" selected>---Select---</option>
              <option [value]="N.PD_Id" *ngFor="let N of ProjectList;">
                {{N.PD_Project_Name}}
              </option>
            </select>
          </div>
        </div>
        <div class="col-md-6">
          <div class="input-group">
            <label for="">Building / Block Name</label>
            <input class="custom-field" type="text" style="text-transform: capitalize;" [(ngModel)]="P.PR_BlK_NME"
              #PR_BlK_NME="ngModel" name="PR_BlK_NME" [disabled]="mode=='View'" required>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6">
          <div class="input-group">
            <label for="">   Property Name         </label>   
            <input type="text" class="form-control" style="text-transform: capitalize;" [(ngModel)]="P.PR_NME"
                  #PR_NME="ngModel" name="PR_NME" [disabled]="mode=='View'" required>         
          </div>
        </div>  
        <div class="col-md-6">
          <div class="input-group">
            <label for="">   Property Type         </label>        
            <select class="custom-field" [(ngModel)]="P.PR_TYPE" #PR_TYPE="ngModel" name="PR_TYPE"
                  [disabled]="mode=='View'" required>
                  <option [value]="undefined" selected>---Select---</option>
                  <option [value]="T.fix_code_id" *ngFor="let T of propertyTypeList;">
                    {{T.code_value}}
                  </option>
                </select>    
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6">
          <div class="input-group">
            <label for="">Category</label>
            <select class="custom-field" [(ngModel)]="P.PR_CTGRY" #PR_CTGRY="ngModel" name="PR_CTGRY"
                  [disabled]="mode=='View'" required>
                  <option [value]="undefined" selected>---Select---</option>
                  <option [value]="C.fix_code_id" *ngFor="let C of propertyCategoryList;">
                    {{C.code_value}}
                  </option>
                </select>
          </div>
        </div>
      
        <div class="col-md-6">
          <div class="input-group">
            <label for="">  Floor No.          </label>            
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6">
          <div class="input-group">
            <label for="">Area (Sq.Ft)	</label>
            <input class="custom-field" type="text" >
          </div>
        </div>
        <div class="col-md-6">
          <div class="input-group">
            <label for="">Builtup Areas (Sq.Ft)</label>
            <input class="custom-field" type="text" >
          </div>
        </div>
      </div>
      <br>
      <div class="justify-content-end d-flex"><button class="btn btn-primary" [disabled]="mode=='View'">Add</button></div>
      <div class="table-responsive">
        <table class="table table-striped">
          <thead>
            <tr>
              <td>Sl No.</td>
              <td>Property Name </td>
              <td>Type</td>
              <td>Category</td>
              <td>Floor No.</td>
              <td>Area (Sq.Ft)</td>
              <td>Builtup Areas (Sq.Ft)</td>
            </tr>
          </thead>
          <tbody>
            <tr
              *ngFor="let P of PropertyList ; let i=index">
              <td>{{i+1}}</td>
              <td> <input type="text" class="form-control" style="text-transform: capitalize;" [(ngModel)]="P.PR_NME"
                  #PR_NME="ngModel" name="PR_NME" [disabled]="mode=='View'" required>
              </td>
               <td>
                <select class="custom-field" [(ngModel)]="P.PR_TYPE" #PR_TYPE="ngModel" name="PR_TYPE"
                  [disabled]="mode=='View'" required>
                  <option [value]="undefined" selected>---Select---</option>
                  <option [value]="T.fix_code_id" *ngFor="let T of propertyTypeList;">
                    {{T.code_value}} 
                  </option>
                </select>
              </td>
              <td>
                <select class="custom-field" [(ngModel)]="P.PR_CTGRY" #PR_CTGRY="ngModel" name="PR_CTGRY"
                  [disabled]="mode=='View'" required>
                  <option [value]="undefined" selected>---Select---</option>
                  <option [value]="C.fix_code_id" *ngFor="let C of propertyCategoryList;">
                    {{C.code_value}}
                  </option>
                </select>
              </td>
              <td> <input type="text" class="form-control" style="text-transform: capitalize;" [(ngModel)]="P.PR_FLR_NO"
                  #PR_FLR_NO="ngModel" name="PR_FLR_NO" [disabled]="mode=='View'" required>
              <td> <input type="text" class="form-control" style="text-transform: capitalize;" [(ngModel)]="P.PR_AREA"
                  #PR_AREA="ngModel" name="PR_AREA" [disabled]="mode=='View'" required>
              <td> <input type="text" class="form-control" style="text-transform: capitalize;" [(ngModel)]="P.PR_BLT_AREA" 
                  #PR_BLT_AREA="ngModel" name="PR_BLT_AREA" [disabled]="mode=='View'" required>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="row">
        <div class="col-md-12 d-flex justify-content-center">
          <button [disabled]="mode=='View'" class="btn btn-primary "> Save </button> &nbsp;
          <button [disabled]="mode=='View'" class="btn btn-primary"> Cancel </button>
        </div>
      </div>
    </div>
  </form>
</div>
