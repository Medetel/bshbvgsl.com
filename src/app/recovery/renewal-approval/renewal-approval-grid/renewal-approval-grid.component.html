<div class="wrapper">
  <div class="title themeheading">
    Renewals Approval
    <div class="float-right">
      Items per page:
      <select name="SearchRows" class="noofpage" >
        <option [ngValue]="5">5</option>
        <option [ngValue]="10">10</option>
        <option value="20">20</option>
        <option value="30">30</option>
        <option value="40">40</option>
        <option value="50">50</option>
      </select>
    </div>
    <span class="clearfix"></span>
  </div>

</div>
<div class="searchbar">
  <div class="container">
    <div class="row">
      <div class="col-md-1">
        <label>Search</label>
      </div>
      <div class="col-md-4">
        <select name="SearchCriteria" class="form-control" required>
          <option [ngValue]="undefined" selected>---Select---</option>
        </select>

      </div>
      <div class="col-md-4">
        <input type="text" name="SearchText" class="form-control" placeholder="Search.." required>

      </div>
      <div class="col-md-3">
        <button class="btn btn-default" type="submit">Search</button>
        <button class="btn btn-default" type="reset" >Clear</button>
      </div>
    </div>
  </div>
</div>

<div class="table-responsive" id="auction-grid">
  <table class="table table-striped table-bordered">
    <thead>
      <tr>
       <td rowspan="2">Sl No.</td>
        <!-- <td rowspan="2">Nomination No.</td>
        <td rowspan="2">Nomination Date</td>     -->
        <td colspan="3" class="text-center">Property Details</td>
        <td colspan="5" class="text-center">Agreements Details</td>
        <td colspan="4" class="text-center">Renewal/Termination</td>
      </tr>
      <tr>
        <td >Project</td>
        <td >Property Name</td>
        <td>Property Type</td>
        <td>Agreement No</td> 
        <td>Agreement Date</td> 
        <td>Agreement Type</td>
        <td>Renewed Date</td>  
        <td>Lessee Name</td>  
        <td>Status</td>
        <td>View</td>
        <td>Renew</td>
        <td>Terminate</td>
      </tr>
    </thead>
    <tbody>     
      <tr>
        <td>1</td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td class="text-center">
          <a href="javascript:void(0)">
            <i class="fa fa-lg fa-eye themecolor" ></i>
          </a>
        </td>
        <td>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio1" value="option1">
            <label class="form-check-label" for="inlineRadio1">Renew</label>
          </div>
        </td>
        <td>
          <div class="form-check form-check-inline">
            <input class="form-check-input" data-toggle="modal" data-target=".bd-example-modal-xl" type="radio" name="inlineRadioOptions" id="inlineRadio2" value="option2">
            <label class="form-check-label" for="inlineRadio2">Terminate</label>
          </div>
        </td>

      </tr>

    </tbody>
  </table>
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-11">
        <pagination-controls class="my-pagination" id="pagination" (pageChange)="pageChanged($event)" maxSize="9"
          directionLinks="true" autoHide="false" previousLabel="Previous" nextLabel="Next"
          screenReaderPaginationLabel="Pagination" screenReaderPageLabel="page"
          screenReaderCurrentLabel="You're on page">
        </pagination-controls>
      </div>
      <div class="col-md-1">
        Total:
        <span>{{totalItems}}</span>
      </div>
    </div>
  </div>
</div>

<div class="modal fade bd-example-modal-xl" tabindex="-1" role="dialog" aria-labelledby="myExtraLargeModalLabel"
  aria-hidden="true">
  <div class="modal-dialog modal-xl" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Renewal</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="container-fluid">
          <div class="row">
            <div class="col-md-12">
              <div class="form-group">
                <label for=""> Remarks </label>
                <textarea name="" id="" cols="30" rows="10" class="form-control"> </textarea>
              </div>
            </div>
          </div>
          <br>
          <div class="text-center">
            <button class="btn btn-primary">Save</button>
            <button class="btn btn-primary" data-dismiss="modal" aria-label="Close">Close</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
