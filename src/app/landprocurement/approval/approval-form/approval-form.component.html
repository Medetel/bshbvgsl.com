<div class="wrapper">
  <div class="title themeheading">
    {{title}}
    <button class="btn btn-primary float-right" [routerLink]="['/home/eeapproval']">Back</button>
    <span class="clearfix"></span>
  </div>
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-6">
        <div class="input-group">
          <select name="" id="" class="custom-field"></select>
          <label for="">Proposal Id</label>
        </div>
      </div>
      <div class="col-md-6">
          <label for="">Proposal for : Land Acquisition</label>          
        </div>
    </div>
    <div class="row">
      <div class="col-md-2">
        <label for="">District : <span>Bengaluru</span></label>
      </div>
      <div class="col-md-2">
        <label for="">Taluk : <span>Bengaluru</span></label>
      </div>
      <div class="col-md-2">
        <label for="">Village : <span>Jayanagar</span></label>
      </div>
      <div class="col-md-2">
        <a href="">View Proposal</a>
      </div>
      <div class="col-md-2">
        <a href="">View Viability</a>
      </div>
      <div class="col-md-2">
        <a href="">View Inspection</a>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="input-group">
          <textarea class="custom-field" name="" id="" cols="30" rows="10"></textarea>
          <label for="">Comments</label>
        </div>
      </div>
      <div class="col-md-6">
        <div class="input-group">
          <select name="" id="" class="custom-field"></select>
          <label for="">Status</label>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-12 text-center">
        <button class="btn btn-primary">Save</button><button class="btn btn-primary">Cancel</button>
      </div>
    </div>
  </div>
</div>
