<div class="wrapper">
  <div class="title themeheading">
    {{title}}
    <button class="btn btn-primary float-right" [routerLink]="['/home/registerddoc']">Back</button>
    <span class="clearfix"></span>
  </div>
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-6">
        <div class="input-group"><select name="" id="" class="custom-field"></select><label for="">Proposal Id</label></div>
      </div>
    </div>
    <br>
    <div class="row">
      <div class="col-md-12">
        <div class="table-responsive">
          <table class="table table-striped" style="width:60%;margin:0px auto;">
            <thead>
              <tr>
                <td>Sl No.</td>
                <td>Document Type</td>
                <td>Document</td>
                <td>View</td>
                <td>Delete</td>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>1.</td>
                <td><select name="" id="" class="form-control">
                  <option value="">---Select---</option>
                </select></td>
                <td><input type="file"></td>
                <td><i class="fa fa-eye"></i></td>
                <td><i class="fa fa-trash"></i></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <br>
    <div class="row text-center">
      <div class="col-md-12">
        <button class="btn btn-primary">Save</button><button class="btn btn-primary">Cancel</button>
      </div>
    </div>

  </div>
</div>
