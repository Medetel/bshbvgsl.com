<div class="card-container">
  <fieldset class="fieldset">
    <legend class="legend" style="color: blue;">Enter OTP</legend>
  <div class="card" style="width: 29rem;">
    <form #otpForm="ngForm" name="otpForm">
      <div class="card-body">
        <!-- <h5 align="center"
          style="font-size: 2rem; font-weight: bold; font-family: Arial, Helvetica, sans-serif; color: blue; "
          class="card-title">
          Enter OTP 
        </h5> -->
        <p class="sub">OTP has been sent to your registered mobile number</p>
        <div class="row">
          <div class="col-md-12">
            <div class="input-group">
              <input type="text" class="custom-field form-control" placeholder=" " name="OTP"
              [(ngModel)]="o.OTP" #OTP="ngModel" required pattern="^[0-9]*$" minlength="4" maxlength="4">
              <label>
                OTP 
                <span class="mandatory">*</span>
              </label>
              <div *ngIf="OTP.invalid && (OTP.dirty || OTP.touched)" class="text-danger">
                <span *ngIf="OTP.errors.required">OTP is required</span>
                <span *ngIf="OTP.errors?.pattern">OTP must be numeric characters</span>
                <span *ngIf="OTP.errors.minlength">OTP must be 4 digits</span>
              </div>
            </div>
          </div>
        </div>
        <div class="text-center">
          <button class="btn btn-primary" type="submit"  (click)="VerifyforgotMobileOTP(this.m.MobileNo,o.OTP)">Next</button>
        </div>
      </div>
    </form>
  </div>
  </fieldset>
</div>
