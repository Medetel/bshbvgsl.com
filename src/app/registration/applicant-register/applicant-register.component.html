<div class="table-responsive">
  <table class="table table-striped grid">
    <thead>
      <tr>
        <td>Sl No.</td>
        <td>Notification No.</td>
        <td>Notification Date</td>
        <td>Project</td>
        <td>Phase</td>
        <td *ngIf="userRole!='CASE WORKER'">Apply Now</td>
      </tr>
    </thead>
    <tbody>
      <tr
        *ngFor="let noti of notificationlist | paginate: { id: 'pagination1',itemsPerPage: itemsPerPage,currentPage: currentPage,totalItems: totalItems }; let i=index">
        <td>{{((currentPage-1)*itemsPerPage)+(i+1)}}.</td>
        <td>{{noti.DSWOId_NO_Number}}</td>
        <td>{{noti.DSWOId_NO_Date | date:'dd-MM-yyyy'}}</td>
        <td>{{noti.PD_Project_Name}}</td>
        <td>{{noti.Phase_Name}}</td>
        <td *ngIf="userRole!='CASE WORKER'">
          <button class="btn btn-primary" type="button"
            [routerLink]="['/auth/applicant-register-form',noti.DSWOId_NO_Id,noti.PD_Id,'applicant']">Apply
            Now</button>
        </td>
      </tr>
    </tbody>
  </table>
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-11">
        <pagination-controls class="my-pagination" id="pagination1" (pageChange)="changepage($event)" maxSize="5"
          directionLinks="true" autoHide="false" previousLabel="Previous" nextLabel="Next"
          screenReaderPaginationLabel="Pagination" screenReaderPageLabel="page"
          screenReaderCurrentLabel="You're on page">
        </pagination-controls>
      </div>
      <div class="col-md-1">
        Total:
        <span>{{totalItems}}</span>
      </div>
    </div>
  </div>
  <div>
 <a href="https://onlinebshb.esdinfra.com" class="btn btn-primary" style="float: right;">Back to home page</a>
 </div>
</div>
