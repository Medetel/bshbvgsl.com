 <div class="card-container"> 
  <fieldset class="fieldset">
    <legend class="legend" style="color: blue;">Enter Mobile Number</legend>
  <div class="card" style="width: 29rem;">
    <form #forgotForm="ngForm" name="forgotForm">
      <div class="card-body">
        <!-- <h5 align="center"
          style="font-size: 2rem; font-weight: bold; font-family: Arial, Helvetica, sans-serif; color: blue; "
          class="card-title">
          Enter Mobile Number
        </h5> -->
        <div class="row">
          <div class="col-md-12">
            <div class="input-group">
              <input type="text" class="custom-field form-control" placeholder=" " name="MobileNo"
              [(ngModel)]="m.MobileNo" #MobileNo="ngModel" required pattern="^[0-9]*$" minlength="10" maxlength="10">
              <label>
                Mobile Number
                <span class="mandatory">*</span>
              </label>
              <div *ngIf="MobileNo.invalid && (MobileNo.dirty || MobileNo.touched)" class="text-danger">
                <span *ngIf="MobileNo.errors.required">Mobile Number is required</span>
                <span *ngIf="MobileNo.errors?.pattern">Mobile Number must be numeric characters</span>
                <span *ngIf="MobileNo.errors.minlength">Mobile Number must be atleast 10
                  characters</span>
              </div>
            </div>
          </div>
        </div>
        <div class="text-center">
          <button class="btn btn-primary" type="submit"  (click)="SaveMobileOTP(m.MobileNo)">Next</button>
        </div>
      </div>
    </form>
  </div>
</fieldset>
 </div>
