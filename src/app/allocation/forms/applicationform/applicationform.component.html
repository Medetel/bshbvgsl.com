<div class="wrapper application">
    <div class="title themeheading">
        {{title}}
        <button *ngIf="!fromUtility" class="btn btn-primary pull-right" [hidden]="appmode!='applicant'" [routerLink]="['/home/appstatus']">Back</button>
        <button *ngIf="fromUtility" class="btn btn-primary pull-right" [routerLink]="['/home/log-view/reroute','reroute']">Back</button>
    </div>

    <form #Application="ngForm" (ngSubmit)="mode=='save'?SaveApplication(Application,APP_PA_Age):UpdateApplication(app.APP_Id,Application,APP_PA_Age,app.APP_No)"
        name="form1" novalidate>
        <div class="container-fluid">
            <div class="row">
                <div class="col-md-2" style="margin-top: 12px;">
                    <label>
                        <!-- <a (click)="FillApplication()">1. Application No.:</a> -->
                        <a>1. Application No.:</a>
                        <span class="clearfix"></span>
                    </label>
                </div>
                <div class="col-md-4" style="margin-top: 10px; margin-left: -41px;">
                    {{app.APP_No}}
                </div>

                <div class="col-md-3" style="margin-top: 12px;">
                    <label>
                        2. Is Joint Registration
                        <span class="mandatory">*</span>
                        <div class="error-msg float-right" *ngIf="APP_IsJoint.invalid && (APP_IsJoint.dirty || APP_IsJoint.touched || formInvalid)">
                            <span *ngIf="APP_IsJoint.errors.required">Field is required</span>
                        </div>
                        <span class="clearfix"></span>
                    </label>
                </div>
                <div class="col-md-3" style="margin-top: 12px;">
                    <div class="form-check form-check-inline">
                        <label class="form-check-label">
                            <input class="form-check-input" required type="radio" id="inlineRadio1" value="Y" name="APP_IsJoint"
                                [(ngModel)]="app.APP_IsJoint" #APP_IsJoint="ngModel"> Yes
                        </label>
                    </div>
                    <div class="form-check form-check-inline">
                        <label class="form-check-label">
                            <input class="form-check-input" required type="radio" id="inlineRadio1" value="N" name="APP_IsJoint"
                                [(ngModel)]="app.APP_IsJoint" #APP_IsJoint="ngModel"> No
                        </label>
                    </div>
                </div>

            </div>

            <div class="row" style=" background: #d1dee8;">
                <h5>Project Details</h5>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <label>
                        <span class="field-title">3. Project Name</span>:
                        <span>{{PD.PD_Project_Name}}</span>
                    </label>
                </div>
                <div class="col-md-6">
                    <label>
                        <span class="field-title">4. Project Place</span>:
                        <span>{{PD.NO_AuctionPlace}}</span>
                    </label>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <label>
                        <span class="field-title">5. District Name</span>:
                        <span>{{PD.DI_District}}</span>
                    </label>
                </div>
                <div class="col-md-6">
                    <label>
                        <span class="field-title">6. Phase</span>:
                        <span>{{PD.Phase_Name}}</span>
                    </label>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <label>
                        <span class="field-title">7. Notification No</span>:
                        <span>{{PD.NO_Number}}</span>
                    </label>
                </div>
                <div class="col-md-6">
                    <label>
                        <span class="field-title">8. Notification Date</span>:
                        <span>{{PD.NO_Date | date:'dd-MM-yyyy'}}</span>
                    </label>
                </div>
            </div>

            <div class="row">
                <div class="col-md-2" style="margin-top: 12px;">
                    <label>
                        9. Property Type
                        <span class="mandatory">*</span>
                        <div class="error-msg float-right" *ngIf="APP_PropertyType.invalid && (APP_PropertyType.dirty || APP_PropertyType.touched || formInvalid)">
                            <span *ngIf="APP_PropertyType.errors.required">Property Type is required</span>
                        </div>
                        <span class="clearfix"></span>
                    </label>
                </div>
                <div class="col-md-4" style="margin-top: 12px;">
                    <div class="form-check form-check-inline">
                        <label class="form-check-label">
                            <input required class="form-check-input" type="radio" value="House" name="APP_PropertyType"
                                [(ngModel)]="app.APP_PropertyType" #APP_PropertyType="ngModel" id="inlineRadio1"> House
                        </label>
                    </div>
                    <div class="form-check form-check-inline">
                        <label class="form-check-label">
                            <input required class="form-check-input" type="radio" value="Site" name="APP_PropertyType"
                                [(ngModel)]="app.APP_PropertyType" #APP_PropertyType="ngModel" id="inlineRadio1"> Plot
                        </label>
                    </div>
                    <div class="form-check form-check-inline">
                        <label class="form-check-label">
                            <input required class="form-check-input" type="radio" value="Flat" name="APP_PropertyType"
                                [(ngModel)]="app.APP_PropertyType" #APP_PropertyType="ngModel" id="inlineRadio1"> Flat
                        </label>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="input-group">
                        <select [(ngModel)]="app.APP_CA_Id_FK" required #APP_CA_Id_FK="ngModel" name="APP_CA_Id_FK"
                            class="custom-field">
                            <option [ngValue]="undefined" selected>---Select---</option>
                            <option [ngValue]="ca.CA_Id" *ngFor="let ca of Categories;">
                                {{ca.CA_CategoryName}}</option>
                        </select>
                        <label>
                            10. Property category
                            <span class="mandatory">*</span>
                            <div class="error-msg" *ngIf="APP_CA_Id_FK.invalid && (APP_CA_Id_FK.dirty || APP_CA_Id_FK.touched || formInvalid)">
                                <span *ngIf="APP_CA_Id_FK.errors.required">Property Category is required</span>
                            </div>
                        </label>
                    </div>
                </div>

            </div>

            <div class="row" style=" background: #d1dee8;">
                <h5>Applicant Details</h5>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="input-group">
                        <input type="text" oninput="this.value = this.value.toUpperCase()" class="custom-field"
                            placeholder=" " minlength="3" maxlength="40" name="APP_PA_Name" [(ngModel)]="app.APP_PA_Name"
                            #APP_PA_Name="ngModel" required>
                        <label> Applicant's Name
                            <span class="mandatory">*</span>
                            <div class="error-msg" *ngIf="APP_PA_Name.invalid && (APP_PA_Name.dirty || APP_PA_Name.touched || formInvalid)">
                                <span *ngIf="APP_PA_Name.errors.required">Name field is required</span>
                                <span *ngIf="APP_PA_Name.errors.minlength">Name must be atleast 3 characters</span>
                            </div>
                        </label>
                    </div>
                </div>
                <!-- <div class="col-md-6">
                    <div class="input-group">
                        <select [(ngModel)]="app.APP_Gr_Id_Fk " #APP_Gr_Id_Fk="ngModel" name="APP_Gr_Id_Fk "  class="custom-field" required>
                            <option [ngValue]="undefined" selected>---Select---</option>
                            <option [ngValue]="gr.GR_Id" *ngFor="let gr of GRelations;">
                                {{gr.GR_Name}}</option>
                        </select>
                        <label for="">
                            Relationship
                            <span class="mandatory">*</span>
                        </label>
                        <div class="error-msg" *ngIf="APP_Gr_Id_Fk .invalid && (APP_Gr_Id_Fk .dirty || APP_Gr_Id_Fk .touched)">
                            <span *ngIf="APP_Gr_Id_Fk .errors.required">Relationship field is required</span>
                        </div>
                    </div>
                </div> -->
                <div class="col-md-6">
                    <div class="input-group">
                        <input type="text" oninput="this.value = this.value.toUpperCase()" class="custom-field"
                            placeholder=" " minlength="3" maxlength="40" name="APP_PA_Relation_Name" [(ngModel)]="app.APP_PA_Relation_Name"
                            #APP_PA_Relation_Name="ngModel" required>
                        <label> Father/Husband/Wife Name
                            <span class="mandatory">*</span>
                            <div class="error-msg" *ngIf="APP_PA_Relation_Name.invalid && (APP_PA_Relation_Name.dirty || APP_PA_Relation_Name.touched || formInvalid)">
                                <span *ngIf="APP_PA_Relation_Name.errors.minlength">Name must be atleast 3 characters</span>
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- <div class="row">
                <div class="col-md-6">
                    <div class="input-group">
                        <input type="text" oninput="this.value = this.value.toUpperCase()" *ngIf="" class="custom-field" placeholder=" " minlength="3" maxlength="40"
                            name="APP_OtherRelName " [(ngModel)]="app.APP_OtherRelName " #APP_OtherRelName="ngModel" required>

                            <span class="mandatory">*</span>
                            <span class="mandatory">*</span>

                                <span *ngIf="APP_OtherRelName .errors.required">Other Relation Name is required</span>
                            </div>
                        </label>

                <div class="col-md-6">

                            <span class="mandatory">*</span>

            <div class="row" *ngIf="app.APP_IsJoint=='Y'">
                <div class="col-md-6">
                    <div class="input-group">
                        <input type="text" class="custom-field" oninput="this.value = this.value.toUpperCase()"
                            placeholder=" " minlength="3" maxlength="40" name="APP_SA_Name" [(ngModel)]="app.APP_SA_Name"
                            #APP_SA_Name="ngModel">
                        <label>
                            11. Applicant's Name-II
                            <div class="error-msg" *ngIf="APP_SA_Name.invalid && (APP_SA_Name.dirty || APP_SA_Name.touched)">
                                <!-- <span *ngIf="APP_SA_Name.errors.required">Name field is required</span> -->
                                <span *ngIf="APP_SA_Name.errors.minlength">Name must be atleast 3 characters</span>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="input-group">
                        <select [(ngModel)]="app.APP_SA_Relation_Id_FK" #APP_SA_Relation_Id_FK="ngModel" name="APP_SA_Relation_Id_FK"
                            class="custom-field">
                            <option [ngValue]="undefined" selected>---Select---</option>
                            <option [ngValue]="r.Relation_Id" *ngFor="let r of Relations;">
                                {{r.Relation_Name}}</option>
                        </select>
                        <label for="">
                            Relationship
                            <!-- <div class="error-msg" *ngIf="APP_SA_Relation_Id_FK.invalid && (APP_SA_Relation_Id_FK.dirty || APP_SA_Relation_Id_FK.touched)">
                                    <span *ngIf="APP_SA_Relation_Id_FK.errors.required">Relationship field is required</span>
                                </div> -->
                        </label>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-3">
                    <label>
                        13.Applicant Gender
                        <span class="mandatory">*</span>
                        <div class="error-msg" *ngIf="APP_PA_Gender.invalid && (APP_PA_Gender.dirty || APP_PA_Gender.touched || formInvalid)">
                            <span *ngIf="APP_PA_Gender.errors.required">Gender is required</span>
                        </div>
                    </label>
                </div>
                <div class="col-md-3">
                    <div class="form-check form-check-inline">
                        <label class="form-check-label">
                            <input class="form-check-input" required type="radio" id="inlineRadio1" value="Male" name="APP_PA_Gender"
                                [(ngModel)]="app.APP_PA_Gender" #APP_PA_Gender="ngModel"> Male
                        </label>
                    </div>
                    <div class="form-check form-check-inline">
                        <label class="form-check-label">
                            <input class="form-check-input" required type="radio" id="inlineRadio1" value="Female" name="APP_PA_Gender"
                                [(ngModel)]="app.APP_PA_Gender" #APP_PA_Gender="ngModel"> Female
                        </label>
                    </div>
                    <div class="form-check form-check-inline">
                        <label class="form-check-label">
                            <input class="form-check-input" required type="radio" id="inlineRadio1" value="Transgender"
                                name="APP_PA_Gender" [(ngModel)]="app.APP_PA_Gender" #APP_PA_Gender="ngModel">
                            Transgender
                        </label>
                    </div>
                </div>
                <div class="col-md-3" *ngIf="app.APP_IsJoint=='Y'">
                    <label>
                        13.Secondary Applicant Gender
                        <!-- <div class="error-msg" *ngIf="APP_SA_Gender.invalid">
                            <span *ngIf="APP_SA_Gender.errors.required">Gender is required</span>
                        </div> -->
                    </label>
                </div>
                <div class="col-md-3" *ngIf="app.APP_IsJoint=='Y'">
                    <div class="form-check form-check-inline">
                        <label class="form-check-label">
                            <input class="form-check-input" type="radio" id="inlineRadio1" value="Male" name="APP_SA_Gender"
                                [(ngModel)]="app.APP_SA_Gender" #APP_SA_Gender="ngModel"> Male
                        </label>
                    </div>
                    <div class="form-check form-check-inline">
                        <label class="form-check-label">
                            <input class="form-check-input" type="radio" id="inlineRadio1" value="Female" name="APP_SA_Gender"
                                [(ngModel)]="app.APP_SA_Gender" #APP_SA_Gender="ngModel"> Female
                        </label>
                    </div>
                    <div class="form-check form-check-inline">
                        <label class="form-check-label">
                            <input class="form-check-input" type="radio" id="inlineRadio1" value="Transgender" name="APP_SA_Gender"
                                [(ngModel)]="app.APP_SA_Gender" #APP_SA_Gender="ngModel"> Transgender
                        </label>
                    </div>
                </div>

            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="input-group">
                        <input (change)=CalculateAge(app.APP_PA_DOB); type="date" class="custom-field" placeholder=" "
                            name="APP_PA_DOB" [(ngModel)]="app.APP_PA_DOB" #APP_PA_DOB="ngModel" required>
                        <label>
                            14.Applicant's Date of Birth
                            <span class="mandatory">*</span>
                            <div class="error-msg" *ngIf="APP_PA_DOB.invalid && (APP_PA_DOB.dirty || APP_PA_DOB.touched || formInvalid)">
                                <span *ngIf="APP_PA_DOB.errors.required">DOB is required</span>
                            </div>
                        </label>
                    </div>
                </div>
                <div class="col-md-6" style="margin-top: 12px;">
                    <label>
                        <span class="field-title">15. Age (in Years)</span>:
                        <span *ngIf="APP_PA_Age!=undefined"> {{APP_PA_Age}}Years</span>
                    </label>
                </div>
            </div>

            <div class="row" *ngIf="app.APP_IsJoint=='Y'">
                <div class="col-md-6">
                    <div class="input-group">
                        <input (change)=CalculateSAAge(app.APP_SA_DOB); type="date" class="custom-field" placeholder=" "
                            name="APP_SA_DOB" [(ngModel)]="app.APP_SA_DOB" #APP_SA_DOB="ngModel">
                        <label>
                            14.Secondary Applicant's Date of Birth
                            <!-- <div class="error-msg" *ngIf="APP_SA_DOB.invalid && (APP_SA_DOB.dirty || APP_SA_DOB.touched)">
                                <span *ngIf="APP_SA_DOB.errors.required">DOB is required</span>
                            </div> -->
                        </label>
                    </div>
                </div>
                <div class="col-md-6" style="margin-top: 12px;">
                    <label>
                        <span class="field-title">15. Age (in Years)</span>:
                        <span *ngIf="APP_SA_Age!=undefined"> {{APP_SA_Age}}Years</span>
                    </label>
                </div>
            </div>

            <div class="row">

                <div class="col-md-6">
                    <div class="input-group">
                        <input type="text" class="custom-field" oninput="this.value = this.value.toUpperCase()"
                            placeholder=" " minlength="10" maxlength="10" name="APP_PA_PanNo" [(ngModel)]="app.APP_PA_PanNo"
                            #APP_PA_PanNo="ngModel" required>
                        <label>
                            15. Applicant's I.T.Pan No.(if available)
                            <span class="mandatory">*</span>
                            <div class="error-msg" *ngIf="APP_PA_PanNo.invalid && (APP_PA_PanNo.dirty || APP_PA_PanNo.touched || formInvalid)">
                                <span *ngIf="APP_PA_PanNo.errors.minlength">PAN No. must be atleast 10 characters</span>
                                <span *ngIf="APP_PA_PanNo.errors.required">PAN No. is required</span>
                            </div>
                        </label>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="input-group">
                        <input type="text" class="custom-field" placeholder=" " minlength="12" maxlength="12" [pattern]="numericpattern"
                            name="APP_PA_AdharNo" [(ngModel)]="app.APP_PA_AdharNo" #APP_PA_AdharNo="ngModel" required>
                        <label>
                            16.Applicant's Aadhaar No.
                            <span class="mandatory">*</span>
                            <div class="error-msg" *ngIf="APP_PA_AdharNo.invalid && (APP_PA_AdharNo.dirty || APP_PA_AdharNo.touched || formInvalid)">
                                <span *ngIf="APP_PA_AdharNo.errors.minlength">Aadhaar No. must be 12 characters</span>
                                <span *ngIf="APP_PA_AdharNo.errors.required">Aadhaar No. is required</span>
                                <span *ngIf="APP_PA_AdharNo.errors?.pattern">Aadhaar No. must be numeric characters</span>
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <div class="row" *ngIf="app.APP_IsJoint=='Y'">

                <div class="col-md-6">
                    <div class="input-group">
                        <input type="text" class="custom-field" oninput="this.value = this.value.toUpperCase()"
                            placeholder=" " minlength="10" maxlength="10" name="APP_SA_PanNo" [(ngModel)]="app.APP_SA_PanNo"
                            #APP_SA_PanNo="ngModel">
                        <label>
                            15. Secondary Applicant's I.T.Pan No.(if available)
                            <div class="error-msg" *ngIf="APP_SA_PanNo.invalid">
                                <span *ngIf="APP_SA_PanNo.errors.minlength">PAN No. must be atleast 10 characters</span>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="input-group">
                        <input type="text" class="custom-field" placeholder=" " [pattern]="numericpattern" minlength="12"
                            maxlength="12" name="APP_SA_AdharNo" [(ngModel)]="app.APP_SA_AdharNo" #APP_SA_AdharNo="ngModel">
                        <label>
                            16.Secondary Applicant's Aadhaar No.
                            <div class="error-msg" *ngIf="APP_SA_AdharNo.invalid && (APP_SA_AdharNo.dirty || APP_SA_AdharNo.touched)">
                                <span *ngIf="APP_SA_AdharNo.errors.minlength">Aadhaar No. must be 12 characters</span>
                                <span *ngIf="APP_SA_AdharNo.errors?.pattern">Aadhaar No. must be numeric characters</span>
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <div class="row">

                <div class="col-md-6">
                    <div class="input-group">
                        <select [(ngModel)]="app.APP_Relegion_Id_FK" required #APP_Relegion_Id_FK="ngModel" name="APP_Relegion_Id_FK"
                            class="custom-field">
                            <option [ngValue]="undefined" selected>---Select---</option>
                            <option [ngValue]="r.Relegion_Id" *ngFor="let r of Relegions;">
                                {{r.Relegion_Name}}</option>
                        </select>
                        <label>
                            17. Religion
                            <span class="mandatory">*</span>
                            <div class="error-msg" *ngIf="APP_Relegion_Id_FK.invalid && (APP_Relegion_Id_FK.dirty || APP_Relegion_Id_FK.touched || formInvalid)">
                                <span *ngIf="APP_Relegion_Id_FK.errors.required">Religion field is required</span>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="input-group">
                        <select [(ngModel)]="app.APP_Reservation_Id_FK" required #APP_Reservation_Id_FK="ngModel" name="APP_Reservation_Id_FK"
                            class="custom-field">
                            <option [ngValue]="undefined" selected>---Select---</option>
                            <option [ngValue]="r.RES_Id" *ngFor="let r of Reservations;">
                                {{r.RES_Name}}</option>
                        </select>
                        <label>
                            18. Reservation
                            <span class="mandatory">*</span>
                            <div class="error-msg" *ngIf="APP_Reservation_Id_FK.invalid && (APP_Reservation_Id_FK.dirty || APP_Reservation_Id_FK.touched || formInvalid)">
                                <span *ngIf="APP_Reservation_Id_FK.errors.required">Reservation field is required</span>
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <div class="row">

                <div class="col-md-6">
                    <div class="input-group">
                        <input type="text" class="custom-field" minlength="5" maxlength="10" [pattern]="numericpattern"
                            placeholder=" " name="APP_AnnualIncome" (change)="CheckAnnualIncome(app.APP_CA_Id_FK,app.APP_AnnualIncome)"
                            [(ngModel)]="app.APP_AnnualIncome" #APP_AnnualIncome="ngModel" required>
                        <label>
                            19. Annual Income (Rs.)
                            <span class="mandatory">*</span>
                            <div class="error-msg" *ngIf="APP_AnnualIncome.invalid && (APP_AnnualIncome.dirty || APP_AnnualIncome.touched || formInvalid)">
                                <span *ngIf="APP_AnnualIncome.errors.minlength">Annual Income must be 5 characters</span>
                                <span *ngIf="APP_AnnualIncome.errors.required">Annual Income is required</span>
                                <span *ngIf="APP_AnnualIncome.errors?.pattern">Annual Income must be numeric characters</span>
                            </div>
                            <span class="error-msg">{{app.APP_AnnualIncomeErrorMessage}}</span>
                        </label>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="input-group">
                        <input type="text" class="custom-field" placeholder=" " minlength="1" maxlength="2" [pattern]="numericpattern"
                            name="APP_YearsResiding" [(ngModel)]="app.APP_YearsResiding" #APP_YearsResiding="ngModel"
                            required>
                        <label>
                            20. No. of Years residing in Bihar
                            <span class="mandatory">*</span>
                            <div class="error-msg" *ngIf="APP_YearsResiding.invalid && (APP_YearsResiding.dirty || APP_YearsResiding.touched || formInvalid)">
                                <span *ngIf="APP_YearsResiding.errors.required">No. of Years in Bihar is required</span>
                                <span *ngIf="APP_YearsResiding.errors?.pattern">No. of Years in Bihar must be
                                    numeric characters</span>
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <div class="row">

                <div class="col-md-6">
                    <div class="input-group">
                        <input type="text" placeholder=" " oninput="this.value = this.value.toUpperCase()" class="custom-field"
                            minlength="3" maxlength="40" name="APP_NomineeName" [(ngModel)]="app.APP_NomineeName"
                            #APP_NomineeName="ngModel" required>
                        <label>
                            21. Name of the Nominee<span class="mandatory">*</span>
                            <div class="error-msg" *ngIf="APP_NomineeName.invalid && (APP_NomineeName.dirty || APP_NomineeName.touched || formInvalid)">
                                <span *ngIf="APP_NomineeName.errors.minlength">Name must be atleast 3 characters</span>
                                <span *ngIf="APP_NomineeName.errors.required">NomineeName is required</span>
