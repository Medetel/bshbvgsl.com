<div class="wrapper">

  <form #searchForm="ngForm">

<div class="searchbar">
  <div class="container">
      <div class="row">
          <div class="col-md-1">
              <label>Search</label>
          </div>
          <div class="col-md-4">
              <select name="SearchCriteria" class="form-control" required>
                  <option [ngValue]="undefined" selected>---Select---</option>
                  <option value="office-code">Scheme</option>
                  <option value="office-name">District</option>
                  <option value="address">Project</option>
                  <option value="email">Total Properties</option>
              </select>
              <!-- <div *ngIf="SearchCriteria.invalid && (SearchCriteria.dirty || SearchCriteria.touched)" class="error-msg">
                  <div *ngIf="SearchCriteria.errors.required">Search criteria is required</div>
              </div> -->
          </div>
          <div class="col-md-4">
              <input type="text" name="SearchText" class="form-control" placeholder="Search.."
                  required>
              <!-- <div *ngIf="SearchText.invalid && (SearchText.dirty || SearchText.touched)" class="error-msg">
                  <div *ngIf="SearchText.errors.required">Search text is required</div>
              </div> -->
          </div>
          <div class="col-md-3">
              <button class="btn btn-default" type="submit">Search</button>
              <button class="btn btn-default" type="reset" >Clear</button>
          </div>
      </div>
  </div>
</div>

<div class="title themeheading">{{title}}
<div class="float-right">
    Items per page:
    <select >
        <option [ngValue]="5">5</option>
        <option [ngValue]="10">10</option>
        <option value="20">20</option>
        <option value="30">30</option>
        <option value="40">40</option>
        <option value="50">50</option>
    </select>
    <a class="btn btn-primary " routerLink="/home/change-property/change-propertyform">Add</a>
</div>
<span class="clearfix"></span>
</div>

<div class="table-responsive">
  <table class="table table-striped grid">
      <thead>
        <tr>
          <td>Sl No.</td>
          <td>Property No.</td>
          <td>East</td>   
          <td>West</td>       
          <td>North</td>   
          <td>South</td> 
          <td>Current quota</td>
          <!-- <td>Total Properties</td> -->
          <!-- <td>View</td>
          <td>Edit</td>
          <td>Delete</td> -->
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let q of changepropertyquotalist;let i=index;">
          <td>{{i+1}}.</td>
          <td>{{q.PR_Property_No}}</td>
          <td>{{q.PR_B_East}}</td>   
          <td>{{q.PR_B_West}}</td>       
          <td>{{q.PR_B_North}}</td>   
          <td>{{q.PR_B_South}}</td>   
          <td>{{q.RES_Name}}</td>
          <!-- <td>20</td> -->

            <a href="#">
                <i class="fa fa-lg fa-eye themecolor"></i>
            </a>
        </td>
        <td>
            <a href="#">
                <i class="fa fa-lg fa-edit themecolor"></i>
            </a>
        </td>
        <td>
            <a href="javascript:void(0);">
                <i class="fa fa-lg fa-trash themecolor"></i>
            </a> -->
            <!-- <a href="javascript:void(0);"   class="highlight-inactive">
                <i class="fa fa-lg fa-user-plus themecolor"></i>
            </a> -->
        <!-- </td> -->
        </tr>
        
      </tbody>
  </table>
</div>
</form>
</div>
