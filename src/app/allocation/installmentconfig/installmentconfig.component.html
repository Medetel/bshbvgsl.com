<div class="wrapper">
    <div class="searchbar">
        <div class="container">
            <div class="row">
                <div class="col-md-1">
                    <label>Search</label>
                </div>
                <div class="col-md-4">
                    <select name="SearchCriteria" class="form-control" required>
                        <option [ngValue]="undefined" selected>---Select---</option>
                        <option value="office-code">Notification No.</option>
                        <option value="office-name">Type</option>
                        <option value="address">Installment No.</option>
                        <option value="address">Installment Due Date</option>
                        <option value="address">Amount</option>
                    </select>
                    <!-- <div *ngIf="SearchCriteria.invalid && (SearchCriteria.dirty || SearchCriteria.touched)" class="error-msg">
                        <div *ngIf="SearchCriteria.errors.required">Search criteria is required</div>
                    </div> -->
                </div>
                <div class="col-md-4">
                    <input type="text" name="SearchText"  class="form-control" placeholder="Search.."
                        required>
                    <!-- <div *ngIf="SearchText.invalid && (SearchText.dirty || SearchText.touched)" class="error-msg">
                        <div *ngIf="SearchText.errors.required">Search text is required</div>
                    </div> -->
                </div>
                <div class="col-md-3">
                    <button class="btn btn-default" type="submit">Search</button>
                    <button class="btn btn-default" type="reset">Clear</button>
                </div>
            </div>
        </div>
    </div>
  <div class="title themeheading">
    {{title}}
  </div>
  <div class="container-fluid">
    <div class="table-responsive grid">
      <table class="table table-striped">
        <thead>
          <tr>
            <td>Sl No.</td>
            <td>Notification No.</td>
            <td>Type</td>
            <td>Installment No.</td>
            <td>Installment Due Date</td>
            <td>Amount</td>
          </tr>
        </thead>

          <tr>

              <td>3.</td>

            </tr>
        </tbody>
      </table>
    </div>
    <div class="btn-wrapper">
      <button class="btn btn-primary">Save</button>
      <button class="btn btn-primary">Cancel</button>
    </div>
  </div>
</div>
