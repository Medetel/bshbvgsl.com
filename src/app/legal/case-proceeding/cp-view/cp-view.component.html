<div class="wrapper">

    <form #searchForm="ngForm" (ngSubmit)="onSearch(searchForm,itemsPerPage,1)">           
            <div class="title themeheading">{{title}}                                  
                    <div class="float-right">                       
                        <a class="btn btn-primary" [routerLink]="['/home/caseproceeding']">Back</a>                        
                    </div>
                    <span class="clearfix"></span>
                </div>
        

       
            
            <div class="row">&nbsp;</div>
            <div class="title2 themeheading2 row1">
                <div class="row margin">  
                    <div class="col-md-1">&nbsp;</div>                
                        <div class="col-md-3">
                          <label for="">Case No <span>: {{caseDetails.Case_No}}</span></label>
                        </div>
                        <div class="col-md-3">
                          <label for="">
                            <label for="">Registration Date <span>:{{caseDetails.Case_Reg_Date| date:'dd-MM-yyyy'}}</span></label>
                          </label>
                        </div>
                        <div class="col-md-3">
                          <label for="">Court Name<span>: {{caseDetails.Court_Name}}</span></label>
                        </div>                    
                      </div>
                      <div class="float-right">
                        <a class="btn btn-primary btnallign" [routerLink]="['/home/caseproceeding/case-pro-form',Case_Id,'create',0]">Add Proceedings</a>
                      </div>
                </div>

                <div class="row">&nbsp;</div>

            <div class="searchbar">
                <div class="container">
                    <div class="row">
                        <div class="col-md-1">
                            <label>Search</label>
                        </div>
                        <div class="col-md-4">
                            <select name="SearchCriteria" #SearchCriteria="ngModel" [(ngModel)]="s.SearchCriteria" class="form-control" required>
                                <option [ngValue]="undefined" selected>---Select---</option> 
                                <option value="CaseProc_NextHearingDate" >Next Hearing Date</option>                           
                            </select>
                            <div *ngIf="SearchCriteria.invalid && (SearchCriteria.dirty || SearchCriteria.touched)" class="error-msg">
                                    <div *ngIf="SearchCriteria.errors.required">Search criteria is required</div>
                            </div>            

                       </div>
                        <div class="col-md-4">
                            <input type="text" name="SearchText" #SearchText="ngModel" [(ngModel)]="s.SearchText"  class="form-control" placeholder="Search.."
                                required>
                                <div *ngIf="SearchText.invalid && (SearchText.dirty || SearchText.touched)" class="error-msg">
                                        <div *ngIf="SearchText.errors.required">Search text is required</div>
                                    </div>
                        </div>             
                        
                        <div class="col-md-3">
                            <button class="btn btn-default" type="submit">Search</button>
                            <button class="btn btn-default" type="reset" (click)="GetCaseProceedingDetails()">Clear</button>
                        </div>
                    </div>
                </div>
            </div>
            
            
    
        <div class="table-responsive">
            <table class="table table-striped grid">
                <thead>
                    <tr>
                        <td>Sl No.</td>
                        <td>Court Attended</td>
                        <td>Settlement Done</td>
                        <td>Status</td>
                        <td>Next Hearing Date</td>
                        <td class="text-center">View</td>
                        <td class="text-center">Edit</td>
                        <td class="text-center">Delete</td>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let cp of caseProceedingdetails; let i=index">
                        
                        <td>{{i+1}}</td>
                        <td *ngIf="cp.CaseProc_Courtattend == 'Y'">Yes</td>
                        <td *ngIf="cp.CaseProc_Courtattend == 'N'">No</td>
                        <td *ngIf="cp.CaseProc_SettlementDone == 'Y'">Yes</td>
                        <td *ngIf="cp.CaseProc_SettlementDone == 'N'">No</td>
                        <td>{{cp.CaseProc_Status}}</td>
                        <td *ngIf="cp.CaseProc_Status == 'Ongoing'">{{cp.CaseProc_NextHearingDate | date:'dd-MM-yyyy'}}</td>
                        <td *ngIf="cp.CaseProc_Status == 'Disposed'">--</td>
                        <td class="text-center">
                            <a href="#" [routerLink]="['/home/caseproceeding/case-pro-form',Case_Id,'view',cp.CaseProc_Id]">
                                <i class="fa fa-lg fa-eye themecolor"></i>
                            </a>
                        </td>
                        <td class="text-center">
                            <a href="#" [routerLink]="['/home/caseproceeding/case-pro-form',Case_Id,'edit',cp.CaseProc_Id]" >
                                <i class="fa fa-lg fa-edit themecolor"></i>
                            </a>
                        </td>
                        <td class="text-center">
                            <a (click)="delete(cp.CaseProc_Id)" href="javascript:void(0);">
                                <i class="fa fa-lg fa-trash themecolor"></i>
                            </a>                            
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </form>
  </div>
