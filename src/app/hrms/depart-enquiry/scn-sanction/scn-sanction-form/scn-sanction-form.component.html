<div class="wrapper">
  <div class="container-fluid">
    <div class="title rowmarginfix themeheading">
      Show Cause Notice Details
      <button class="btn btn-primary float-right" [routerLink]="['/home/dept-enquiry/scn-sanction']">Back</button>
      <span class="clearfix"></span>
    </div>
    <br>
    <div class="row">
      <div class="col-md-4">
        <label for=""> SCN No : </label>
      </div>
      <div class="col-md-4">
        <div class="input-group ">
          <span for="">Date : </span> <span> 11/11/18 </span>
        </div>
      </div>
      <div class="col-md-4">
        <div class="input-group ">
          <span for="">Status : Pending</span>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <label for="">Due Date to Reply :</label>
      </div>
      <div class="col-md-6">
        <label for="">Mode of Reply :</label>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <label for=""> Additional Details : </label>
      </div>
      <div class="col-md-6">
        <label for=""> Remarks :</label>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <a href=""> View OM Document </a>
      </div>
    </div>
    <br>

    <div class="title themeheading rowmarginfix">
      Sanction Details
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="form-inline">
          <div class="form-group mb-2">
            <label for="" style="color: blue;">Sanctioned : </label>
          </div>
          <div class="form-group mx-sm-3 mb-2">
            <input type="radio" class="form-control" id="radio1" name="exampleRadios1">
            <label for="radio1">Yes</label>
          </div>
          <div class="form-group mx-sm-3 mb-2">
            <input type="radio" class="form-control" id="radio2" name="exampleRadios1">
            <label for="radio2">No</label>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-inline">
          <div class="form-group mb-2">
            <label for="" style="color: blue;">Cancel : </label>
          </div>
          <div class="form-group mx-sm-3 mb-2">
            <input type="radio" class="form-control" id="radio3" name="exampleRadios2">
            <label for="radio3">Yes</label>
          </div>
          <div class="form-group mx-sm-3 mb-2">
            <input type="radio" class="form-control" id="radio4" name="exampleRadios2">
            <label for="radio4">No</label>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <label for="">Sanctioned By :</label>
      </div>
      <div class="col-md-6">
        <label for="">Sanctioned Date :</label>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <label for="">Canceled By :</label>
      </div>
      <div class="col-md-6">
        <label for="">Canceled Date :</label>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="input-group">
          <label for="">Remarks</label>
          <textarea name="" id="" cols="30" rows="10" class="custom-field"></textarea>
        </div>
      </div>
    </div>

    <br>
    <div class="justify-content-center d-flex">
      <button class="btn btn-primary">Save</button> &nbsp;
      <button class="btn btn-primary">Cancel</button>
    </div>
    <br>
  </div>
</div>
