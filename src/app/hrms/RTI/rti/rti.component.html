<div class="wrapper">
  <div class="title themeheading">
    Add RTI Form
    <button class="btn btn-primary float-right" [routerLink]="['/home/rti']">Back</button>
    <span class="clearfix"></span>
  </div>
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-4">
        <label for="">RTI No :</label>
      </div>
      <div class="col-md-4">
        Date :
        <span>11/12/2019</span>
      </div>
      <div class="col-md-4">
        Status :
        <span>Pending</span>
      </div>
    </div>
    <div class="title themeheading rowmarginfix">
      RTI Information
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="input-group">
          <input type="text" class="custom-field">
          <label for="">Subject</label>
        </div>
      </div>
      <div class="col-md-6">
        <div class="input-group">
          <select class="custom-field"></select>
          <label for="">Mode of Application</label>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="input-group">
          <select class="custom-field"></select>
          <label for="">BPL</label>
        </div>
      </div>
      <div class="col-md-6">
        <div class="input-group">
          <textarea class="custom-field"></textarea>
          <label for="">Remarks</label>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-3">
        <div class="input-group">
          <input type="text" class="custom-field">
          <label for="">Postal Order</label>
        </div>
      </div>
      <div class="col-md-3">
          <div class="input-group">
            <input type="date" class="custom-field">
            <label for="">Postal Order Date</label>
          </div>
        </div>
      <div class="col-md-6">
        <div class="input-group">
          <input type="text" class="custom-field">
          <label for="">Amount</label>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="input-group">
          <input type="text" class="custom-field">
          <label for="">Extra Amount</label>
        </div>
      </div>
      <div class="col-md-3">
        <div class="input-group">
          <select class="custom-field">
            <option value="">--Select--</option>
            <option value="">Yes</option>
            <option value="">No</option>
          </select>
          <label for="">Confidential Info 8(1)(d)</label>
        </div>
      </div>
      <div class="col-md-3">
        <div class="input-group">
          <select class="custom-field">
            <option value="">--Select--</option>
            <option value="">Yes</option>
            <option value="">No</option>
          </select>
          <label for="">Personal Info 8(1)</label>
        </div>
      </div>
    </div>
    <div class="title themeheading rowmarginfix">
      Applicant Details
    </div>
    <div class="row">
      <div class="col-md-4">
        <div class="input-group">
          <input type="text" class="custom-field">
          <label for="">Applicant Name</label>
        </div>
      </div>
      <div class="col-md-4">
        <div class="input-group">
          <input type="date" class="custom-field">
          <label for="">Application Date</label>
        </div>
      </div>
      <div class="col-md-4">
        <div class="input-group">
          <input type="date" class="custom-field">
          <label for="">Application Received Date</label>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="input-group">
          <input type="text" class="custom-field">
          <label for=""> Address of Applicant </label>
        </div>
      </div>
      <div class="col-md-6">
        <div class="input-group">
          <input type="number" class="custom-field">
          <label for="">Phone No.</label>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="input-group">
          <input type="number" class="custom-field">
          <label for="">Mobile No.</label>
        </div>
      </div>
      <div class="col-md-6">
        <div class="input-group">
          <input type="date" class="custom-field">
          <label for="">Acknowledgment Date</label>
        </div>
      </div>
    </div>

    <div class="title themeheading rowmarginfix">
      BSHB ( Internal Use )
    </div>

    <div class="row">
      <div class="col-md-6">
        <div class="input-group">
          <input type="text" class="custom-field">
          <label for="">Forwarded To Dept PIO</label>
        </div>
      </div>
      <div class="col-md-6">
        <div class="input-group">
          <input type="date" class="custom-field">
          <label for="">Forwarded Date</label>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="input-group">
          <label for="">Replaid ?</label>
          <select name="" id="" class="custom-field">
            <option value="">--Select--</option>
            <option value="">Within Time Limit</option>
            <option value="">After Time Limit</option>
          </select>
        </div>
      </div>
      <div class="col-md-6">
        <div class="input-group">
          <input type="date" class="custom-field">
          <label for="">Replaid Date</label>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="input-group">
          <input type="text" class="custom-field">
          <label for="">Pending At</label>
        </div>
      </div>
      <div class="col-md-6">
        <div class="input-group">
          <input type="date" class="custom-field">
          <label for="">First Appellate Date</label>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="input-group">
          <label for="">First Appellate Authority</label>
          <select name="" id="" class="custom-field">
            <option value="">--Select--</option>
          </select>
        </div>
      </div>
      <div class="col-md-6">
        <div class="input-group">
          <input type="text" class="custom-field">
          <label for=""> Conclusion by First Appellate</label>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="input-group">
          <input type="date" class="custom-field">
          <label for="">Second Appellate Date</label>
        </div>
      </div>
      <div class="col-md-6">
        <div class="input-group">
          <input type="text" class="custom-field">
          <label for="">Second Appellate Authority</label>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="input-group">
          <input type="text" class="custom-field">
          <label for=""> Conclusion by Second Appellate</label>
        </div>
      </div>
    </div>
    <br>
    <div class="text-center">
      <button class="btn btn-primary">Save</button> &nbsp;
      <button class="btn btn-primary">Cancel</button>
    </div>
    <br>
  </div>
</div>
