<div class="wrapper">
  <form #searchForm="ngForm" (ngSubmit)="onSearch(searchForm,itemsPerPage,1)">
    <div class="title themeheading">{{title}}
      <div class="float-right">
        Items per page:
        <select name="SearchRows" #SearchRows="ngModel" [(ngModel)]="itemsPerPage" class="noofpage"
          (change)="itemsPerPageChanged(itemsPerPage, 1)">
          <option [ngValue]="5">5</option>
          <option [ngValue]="10">10</option>
          <option value="20">20</option>
          <option value="30">30</option>
          <option value="40">40</option>
          <option value="50">50</option>
        </select>
        <!-- <a class="btn btn-primary " [routerLink]="['/home/leaveapp/time-roll-gen-form']">Add</a> -->
      </div>
      <span class="clearfix"></span>
    </div>
    <div class="searchbar">
      <div class="container">
        <div class="row">
          <div class="col-md-1">
            <label>Search</label>
          </div>
          <div class="col-md-4">
            <select name="SearchCriteria" class="form-control" required>
              <option [ngValue]="undefined" selected>---Select---</option>
            </select>
          </div>
          <div class="col-md-4">
            <input type="text" name="SearchText" class="form-control" placeholder="Search.." required>
          </div>
          <div class="col-md-3">
            <button class="btn btn-default" type="submit">Search</button>
            <button class="btn btn-default" type="reset">Clear</button>
          </div>
        </div>
      </div>
    </div>

    <div class="table-responsive" id="auction-grid">
      <table class="table table-striped table-bordered">
        <thead>
          <tr>
            <!-- <td rowspan="2">Sl No.</td>
            <td rowspan="2">Leave Application No.</td>
            <td rowspan="2">Date</td>    -->
            <td colspan="4" class="text-center">Division, Month & Year Details</td>
            <td colspan="3" class="text-center">Monthly Process Details</td>
          </tr>
          <tr>
            <td>Sl No.</td>
            <td>Division</td>
            <!-- <td>Year</td> -->
            <td>Month</td>
            <td>Status</td>
            <td>Process</td>
            <td>Finalized</td>
            <!-- <td>Reject</td> -->
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td>
              <select class="custom-field" [(ngModel)]="a.EMP_DIVISION_ID" #EMP_DIVISION_ID="ngModel"
                name="EMP_DIVISION_ID" [disabled]="mode=='view'" (change)="ChangeOfDivision(a.EMP_DIVISION_ID)">
                <option [value]="undefined" selected>---Select---</option>
                <option [value]="d.DI_Id" *ngFor="let d of DistrictsList;">
                  {{d.DI_District}}
                </option>
              </select>

            </td>
            <!-- <td>
              <select class="custom-field" [(ngModel)]="a.calendar_year" (change)="ChangeOfCalendar(a.calendar_year)"
                #calendar_year="ngModel" name="calendar_year" [disabled]="mode=='View'" required>
                <option [value]="undefined" selected>---Select---</option>
                <option [value]="r.calendar_year" *ngFor="let r of YearList;">
                  {{r.calendar_year}}
                </option>
              </select>
            </td> -->
            <td>
              <!-- <select class="custom-field" [(ngModel)]="a.code_value1" (change)="ChangeOfmonth(a.code_value1)" #code_value1="ngModel" name="code_value1"
              [disabled]="mode=='View'" required>
              <option [value]="undefined" selected>---Select---</option>
              <option [value]="r.NumberCoo" *ngFor="let r of EndMonthList;">
                {{r.code_value1}}
              </option>
            </select> -->

              <select class="custom-field" [(ngModel)]="a.code_value1" (change)="ChangeOfmonthyear(a.code_value1)"
                #code_value1="ngModel" name="code_value1" [disabled]="mode=='View'" required>
                <option [value]="undefined" selected>---Select---</option>
                <option [value]="r.monthCode" *ngFor="let r of CalendaryearmonthList;">
                  {{r.monthCode}}
                </option>
              </select>


            </td>
            <td>{{status}}</td>
            <td>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio1" value="option1"
                  (change)="handleChange()">
                <label class="form-check-label" for="inlineRadio1">Process</label>
              </div>
            </td>
            <td>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio1"
                  value="option1">
                <label class="form-check-label" for="inlineRadio1">Finalized</label>
              </div>
            </td>
            <!-- <td>
              <div class="form-check form-check-inline">
                <input class="form-check-input" data-toggle="modal" data-target=".bd-example-modal-xl" type="radio" name="inlineRadioOptions" id="inlineRadio2" value="option2">
                <label class="form-check-label" for="inlineRadio2">Reject</label>
              </div>
            </td> -->

          </tr>

        </tbody>
      </table>
      <div class="container-fluid">
        <div class="row">
          <div class="col-md-11">
            <pagination-controls class="my-pagination" id="pagination" (pageChange)="pageChanged($event)" maxSize="9"
              directionLinks="true" autoHide="false" previousLabel="Previous" nextLabel="Next"
              screenReaderPaginationLabel="Pagination" screenReaderPageLabel="page"
              screenReaderCurrentLabel="You're on page">
            </pagination-controls>
          </div>
          <div class="col-md-1">
            Total:
            <span>{{totalItems}}</span>
          </div>
        </div>
      </div>
    </div>

  </form>
</div>
