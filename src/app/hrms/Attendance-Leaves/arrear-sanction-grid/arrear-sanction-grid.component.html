<div class="wrapper">
  <form >
    <div class="title themeheading">Arrear Sanction
      <div class="float-right">
        Items per page:
        <select ame="SearchRows" #SearchRows="ngModel" [(ngModel)]="ItemsPerPage" class="noofpage"
        (change)="itemsPerPageChanged(ItemsPerPage, 1)">
          <option [ngValue]="5">5</option>
          <option [ngValue]="10">10</option>
          <option value="20">20</option>
          <option value="30">30</option>
          <option value="40">40</option>
          <option value="50">50</option>
        </select>        
        <!-- <a class="btn btn-primary " [routerLink]="['/home/leaveapp/arrear-form']">Add</a> -->
      </div>
      <span class="clearfix"></span>
    </div>
    <div class="searchbar">
      <div class="container">
        <div class="row">
          <div class="col-md-1">
            <label>Search</label>
          </div>
          <div class="col-md-4">
            <select name="SearchCriteria" class="form-control" required>
              <option [ngValue]="undefined" selected>---Select---</option>
            </select>
          </div>
          <div class="col-md-4">
            <input type="text" name="SearchText" class="form-control" placeholder="Search.." required>
          </div>
          <div class="col-md-3">
            <button class="btn btn-default" type="submit">Search</button>
            <button class="btn btn-default" type="reset">Clear</button>
          </div>
        </div>
      </div>
    </div>
    <div class="table-responsive">
      <table class="table table-striped table-bordered">
        <thead>
          <tr>
            <td rowspan="2">Sl No.</td>
            <td rowspan="2">Employee Id</td>
            <td rowspan="2">Employee Name</td>
            <td rowspan="2">No.of days Arrear to be calculated</td>   
            <td rowspan="2">For the month of</td>        
            <!-- <td rowspan="2">Status</td>       -->
            <td colspan="2" class="text-center">Sanction/Rejection</td>
          </tr>
          <tr>
            <td>Sanction</td>
            <td>Reject</td>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let a of arrearsanctionList | paginate: { id: 'pagination',itemsPerPage: itemsPerPage,currentPage: currentPage,totalItems: totalItems }; let i=index">
            <td>{{i+1}}</td>           
            <td>{{a.EMP_EMPLOYEE_CODE}}</td> 
            <td>{{a.EMP_FIRST_NAME}}</td>
            <td>{{a.days}}</td>
            <td>{{a.monthcode}}</td>
            <!-- <td>{{a.arr_status}}</td> -->
            <td>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio"  data-toggle="modal" data-target=".bd-example-modal-xl1"
                  name="inlineRadioOptions" id="inlineRadio1" (change)="handleChange2(a.arr_id)"  value="option1">
                <label class="form-check-label" for="inlineRadio1">Sanction</label>
              </div>
            </td>
            <td>
              <div class="form-check form-check-inline">
                <input class="form-check-input" data-toggle="modal"  data-target=".bd-example-modal-xl2" type="radio"
                  name="inlineRadioOptions" id="inlineRadio2" (change)="handleChange1(a.arr_id)" value="option2">
                <label class="form-check-label" for="inlineRadio2">Reject</label>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </form>
</div>

<div class="modal fade bd-example-modal-xl1" tabindex="-1" role="dialog" aria-labelledby="myExtraLargeModalLabel"
  aria-hidden="true">
  <div class="modal-dialog modal-xl" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Arrear Sanction</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="container-fluid">
          <div class="row">
            <div class="col-md-12">
              <div class="form-group">
                <label for=""> Remarks </label>
                <textarea cols="30" rows="10" class="custom-field" [(ngModel)]="a.remarks" #remarks="ngModel"
                name="remarks"></textarea>
              </div>
            </div>
          </div>
          <br>
          <div class="text-center">
            <button class="btn btn-primary" (click)="save(a.remarks)" [disabled]="saveDisable">Save</button>
            <button class="btn btn-primary" data-dismiss="modal" aria-label="Close">Close</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade bd-example-modal-xl2" tabindex="-1" role="dialog" aria-labelledby="myExtraLargeModalLabel"
  aria-hidden="true">
  <div class="modal-dialog modal-xl" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Arrear Rejection</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="container-fluid">
          <div class="row">
            <div class="col-md-12">
              <div class="form-group">
                <label for=""> Remarks </label>
                <textarea cols="30" rows="10" class="custom-field" [(ngModel)]="a.remarks" #remarks="ngModel"
                name="remarks"></textarea>
              </div>
            </div>
          </div>
          <br>
          <div class="text-center">
            <button class="btn btn-primary" (click)="save(a.remarks)" [disabled]="saveDisable"> Save</button>
            <button class="btn btn-primary" data-dismiss="modal" aria-label="Close">Close</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
