<div class="wrapper">

    <form #searchForm="ngForm">
        <div class="title themeheading">{{title}}
            <div class="float-right">
                Items per page:
                <select name="SearchRows"  class="noofpage" >
                    <option [ngValue]="5">5</option>
                    <option [ngValue]="10">10</option>
                    <option value="20">20</option>
                    <option value="30">30</option>
                    <option value="40">40</option>
                    <option value="50">50</option>
                </select>
                <a class="btn btn-primary " [routerLink]="['/home/serviceregister/medicalverifcation-form']">Add</a>
            </div>
            <span class="clearfix"></span>
        </div>
        <div class="searchbar">
              <div class="container">
                  <div class="row">
                      <div class="col-md-1">
                          <label>Search</label>
                      </div>
                      <div class="col-md-4">
                          <select name="SearchCriteria"  class="form-control" required>
                              <option [ngValue]="undefined" selected>---Select---</option>  
                              <option value="">Division Code</option>
                            <option value="">Department Code</option>       
                            <option value="">Employee Id</option>
                            <option value="">Employee Name</option>    
                                          
                          </select>
                          
                      </div>
                      <div class="col-md-4">
                          <input type="text" name="SearchText"  class="form-control" placeholder="Search.."
                              required>
                          
                      </div>
                      <div class="col-md-3">
                          <button class="btn btn-default" type="submit">Search</button>
                          <button class="btn btn-default" type="reset">Clear</button>
                      </div>
                  </div>
              </div>
          </div>
        <div class="table-responsive">
            <table class="table table-striped grid">
                <thead>
                    <tr>
                        <td>Sl No.</td>
                        <td>Employee Id </td>  
                        <td> Employee Name </td>      
                        <td>Medical Test</td>
                        <td>Date</td>
                        
                      <td class="text-center">View</td>
                      <td class="text-center">Edit</td>
                      <td class="text-center">Delete</td>
                    </tr>
                </thead>
                <tbody>
                    <tr>                        
                        <td> 1 </td>
                        <td></td>
                        <td></td>  
                        <td></td>
                        <td></td>
                        
                        <td class="text-center">
                            <a href="javascript:void(0);">
                                <i class="fa fa-lg fa-eye tdemecolor"></i>
                            </a>
                        </td>
                        <td class="text-center">
                            <a href="javascript:void(0);" >
                                <i class="fa fa-lg fa-edit tdemecolor"></i>
                            </a>
                        </td>
                        <td class="text-center">
                            <a href="javascript:void(0);">
                                <i class="fa fa-lg fa-trash tdemecolor"></i>
                            </a>
                            
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </form>
  </div>
