<div class="wrapper">
  <form #searchForm="ngForm" (ngSubmit)="onSearch(searchForm,itemsPerPage,1)">
    <div class="title themeheading">{{title}}
      <div class="float-right">
        Items per page:
        <select name="SearchRows" #SearchRows="ngModel" [(ngModel)]="itemsPerPage" class="noofpage"
        (change)="itemsPerPageChanged(itemsPerPage, 1)">
        <option [ngValue]="5">5</option>
        <option [ngValue]="10">10</option>
        <option value="20">20</option>
        <option value="30">30</option>
        <option value="40">40</option>
        <option value="50">50</option>
    </select>
        <!-- <a class="btn btn-primary " >Add</a> -->
      </div>
      <span class="clearfix"></span>
    </div>
    <div class="searchbar">
      <div class="container">
        <div class="row">
          <div class="col-md-1">
            <label>Search</label>
          </div>
          <div class="col-md-4">
            <select name="SearchCriteria" class="form-control" required>
              <option [ngValue]="undefined" selected>---Select---</option>
              <option value="">Division Code</option>
              <option value="">Department Code</option>
              <option value="">Employee Id</option>
              <option value="">Employee Name</option>
            </select>            
          </div>
          <div class="col-md-4">
            <input type="text" name="SearchText" class="form-control" placeholder="Search.." required>
          </div>
          <div class="col-md-3">
            <button class="btn btn-default" type="submit">Search</button>
            <button class="btn btn-default" type="reset" >Clear</button>
          </div>
        </div>
      </div>
    </div>
    <div class="table-responsive">
      <table class="table table-striped grid">
        <thead>
          <tr>
            <td>Sl No.</td>
            <td>Employee Id</td>
            <td>Employee Name</td>
            <!-- <td>Year</td> -->
            <td class="text-center">View</td>            
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let e of BasicEmployeeDetails | paginate: { id: 'pagination',itemsPerPage: itemsPerPage,currentPage: currentPage,totalItems: totalItems }; let i=index">
            <td>{{((currentPage-1)*itemsPerPage)+(i+1)}}.</td>
            <td>{{e.EMP_EMPLOYEE_CODE}}</td>
            <td>{{e.EMP_FIRST_NAME}}</td>
            <!-- <td>{{e.Year_CODE}}</td>  -->
            <td class="text-center">
              <a href="javascript:void(0);" [routerLink]="['/home/serviceregister/leave-bal-details-form',e.EMP_ID]">
                <i class="fa fa-lg fa-eye themecolor"></i>
              </a>
            </td>           
          </tr>
        </tbody>
      </table>
    </div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-11">
                <pagination-controls class="my-pagination" id="pagination" (pageChange)="pageChanged($event)" maxSize="9" directionLinks="true"
                    autoHide="false" previousLabel="Previous" nextLabel="Next" screenReaderPaginationLabel="Pagination"
                    screenReaderPageLabel="page" screenReaderCurrentLabel="You're on page">
                </pagination-controls>
            </div>
            <div class="col-md-1">
                Total:
                <span>{{totalItems}}</span>
            </div>
        </div>
    </div>
  </form>
</div>
