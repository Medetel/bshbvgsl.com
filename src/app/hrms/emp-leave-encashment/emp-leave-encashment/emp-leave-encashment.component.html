            <option value="40">40</option>
            <option value="50">50</option>
          </select>
       
        </div>
        <span class="clearfix"></span>
      </div>

      <div class="table-responsive" id="auction-grid">
          <table class="table table-striped table-bordered">
            <thead>
              <tr>
                <td>Sl No.</td>
                <td>Employee Name.</td>
                 
                <td>Leave Type</td>
                <td>Balance Leave</td> 
                <td>View</td> 
                <!-- <td colspan="4" class="text-center" >Employee Details</td> -->
                <td colspan="4" class="text-center">Approval/Rejection Procedure </td>
              </tr>
             
            </thead>
            <tbody>     
                <tr *ngFor="let l of leaveencashmentofficerList;let i=index">    
                  <td>{{i+1}}.</td>         
                    <td>{{l.emp_name}}</td>
                    <td>{{l.Leavename}}</td>
                    <td>{{l.LeaveBalance}}</td>
                   
                    <!-- <td>Generated</td>  
                    <td>Approved</td> 
                    <td>Rejected</td>                     -->
                <td class="text-center">
                  <a href="javascript:void(0);" (click)="view(l.LE_Id)">
                    <i class="fa fa-lg fa-eye themecolor"></i>
                  </a>
                </td>
                <td>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" (change)="handleChange2(l.LE_Id)" data-toggle="modal" data-target=".bd-example-modal-xl1"
                      name="inlineRadioOptions" id="inlineRadio1" value="option1">
                    <label class="form-check-label" for="inlineRadio1">Approval</label>
                  </div>
                </td>
                <td>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" data-toggle="modal" (change)="handleChange1(l.LE_Id)" data-target=".bd-example-modal-xl" type="radio"
                      name="inlineRadioOptions" id="inlineRadio2" value="option2">
                    <label class="form-check-label" for="inlineRadio2">Reject</label>
                  </div>
                </td>
      
            </tr>
      
          </tbody>
        </table>
        <div class="container-fluid">
          <div class="row">
            <div class="col-md-11">
              <pagination-controls class="my-pagination" id="pagination"  maxSize="9"
                directionLinks="true" autoHide="false" previousLabel="Previous" nextLabel="Next"
                screenReaderPaginationLabel="Pagination" screenReaderPageLabel="page"
                screenReaderCurrentLabel="You're on page">
              </pagination-controls>
            </div>
            <div class="col-md-1">
              Total:
              <span>{{totalItems}}</span>
            </div>
          </div>
        </div>
      </div>
      
    
  
    </form>
  </div>
  <div class="modal fade bd-example-modal-xl" tabindex="-1" role="dialog" aria-labelledby="myExtraLargeModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-xl" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel">Leave Encashment Rejection</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <div class="container-fluid">
            <div class="row">
              <div class="col-md-12">
                <div class="form-group">
                  <label for=""> Remarks </label>
                  <textarea cols="30" rows="10" placeholder=" Not as per Procedure,Reject" class="custom-field" [(ngModel)]="a.Comments" #Comments="ngModel"
                  name="Comments" [disabled]="mode=='view'"></textarea>
                </div>
              </div>
            </div>
            <br>
            <div class="text-center">
              <button class="btn btn-primary" data-dismiss="modal" (click)="save(a.Comments)">Save</button>
              <button class="btn btn-primary" data-dismiss="modal" aria-label="Close">Close</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  <!-- </div> -->
</div>
