<div class="wrapper">
    <div class="title themeheading">
        {{title}}
        <button class="btn btn-primary float-right" [routerLink]="['/home/payroll/attendance']">Back</button>
        <span class="clearfix"></span>
    </div>
    <div class="container-fluid">
        <div class="row">
                <div class="col-md-3 col-sm-3">
                        <div class="input-group">
                            <label>Employee Id</label>
                            <select class="custom-field"></select>
                        </div>
                    </div>
                    <div class=" col-md-3 col-sm-3">
                        <label for="">Employee Name :
                            <span>Test Employee</span>
                        </label>
                    </div>                  
                   
        </div>
        <div class="title themeheading rowmarginfix">
            Attendance Details
        </div>
        <div class="row">    
                <div class="col-md-6 col-sm-6">
                        <div class="input-group">
                            <label>Process Month</label><br>
                            <input class="custom-field" type="month" >                    
                        </div>
                    </div>         
            <div class="col-md-6 col-sm-6">
                <div class="input-group">
                    <label>Number of days attended  </label><br>
                    <input class="custom-field" type="text">                    
                </div>
            </div>                   
                   
        </div>
        <div class="row">  
                <div class="col-md-6 col-sm-6">
                        <div class="input-group" >
                            <label>Leave availed</label>										
                            <input class="custom-field" type="text" >		
                        </div>       
                    </div>           
            <div class="col-md-6 col-sm-6">
                <div class="input-group">
                    <label>Loss of pay </label><br>
                    <input class="custom-field" type="text" >     
                </div>
            </div>        
        </div>        
    </div>
    <br>    
    <div class="text-center">
        <button class="btn btn-primary">Save</button> &nbsp;
        <button class="btn btn-primary">Cancel</button>
    </div>
</div>
