<div class="wrapper">
  <div class="title themeheading ">
    Deduction Codes
    <button class="btn btn-primary float-right" [routerLink]="['/home/payroll/deduction-code-grid']">Back</button>
  </div>

  <form (ngSubmit)="mode=='edit'?UpdateAllowanceDedu(Details):SaveAllowanceDedu(Details)"
    #Details="ngForm" name="form1">
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-6" *ngIf="mode =='edit'">
        <div class="input-group">
          <label style="margin-top: 17px;">Deduction Code : {{a.ED_CODE}}</label>
        </div>
      </div>
      <div class=" col-md-6">
        <div class="input-group">
          <label>Deduction Description
           <span class="mandatory">*</span></label>
          <input class="custom-field" type="text" name="ED_DESC" maxlength="30" [(ngModel)]="a.ED_DESC"
          #ED_DESC="ngModel" [disabled]="mode=='view'" required>
        </div>
         <div class="error-msg pull-right"  *ngIf="ED_DESC.invalid && (ED_DESC.dirty || ED_DESC.touched || formInvalid)">
              <span  *ngIf="ED_DESC.errors.required">Description is required</span>             
          </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="input-group">
          <label>Print Name
          <span class="mandatory">*</span> </label>
          <input class="custom-field" type="text" name="PRINT_DESC" maxlength="30" [(ngModel)]="a.PRINT_DESC"
          #PRINT_DESC="ngModel" [disabled]="mode=='view'" required>
        </div>
      </div>
       <div class="error-msg pull-right"  *ngIf="PRINT_DESC.invalid && (PRINT_DESC.dirty || PRINT_DESC.touched || formInvalid)">
              <span  *ngIf="PRINT_DESC.errors.required">Print Description is required</span>             
          </div>

      <!-- <div class="col-md-6">
        <div class="form-group">
          <label>Deduction Type</label>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio1" value="option1">
            <label class="form-check-label" for="inlineRadio1">Fixed</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio2" value="option2">
            <label class="form-check-label" for="inlineRadio2">Variable</label>
          </div>
        </div>
      </div> -->


      <div class="col-md-6">
        <label style="color: blue;">Deduction Type</label> &nbsp;
        <div class="form-check form-check-inline">
            <label class="form-check-label">
              <span class="mandatory">*</span>
                <input class="form-check-input" name="Fixed_Variable_ind" #Fixed_Variable_ind="ngModel"
                    [(ngModel)]="a.Fixed_Variable_ind" type="radio" id="inlineRadio1" value="F" (click)="Fixed()" required> Fixed
            </label>
        </div>
        <div class="form-check form-check-inline">
            <label class="form-check-label">
              <span class="mandatory">*</span>
                <input class="form-check-input" name="Fixed_Variable_ind" #Fixed_Variable_ind="ngModel"
                    [(ngModel)]="a.Fixed_Variable_ind" type="radio" id="inlineRadio1" value="V" (click)="Variable()" required> Variable
            </label>
        </div>
    </div>


</div>
<div class="row">


  <div class="col-md-6">
    <label style="color: blue;">Calculation Type</label> &nbsp;
    <div class="form-check form-check-inline" *ngIf="show1 || (a.ED_Category !== 'F')">
      <label class="form-check-label">
        <span class="mandatory">*</span>
        <input class="form-check-input" name="ED_Category" #ED_Category="ngModel" [(ngModel)]="a.ED_Category"
          type="radio" id="inlineRadio1" value="A" required> Flat Amount
      </label>
    </div>
    <div class="form-check form-check-inline" *ngIf="show1 || (a.ED_Category !== 'A')">
      <label class="form-check-label">
        <span class="mandatory">*</span>
        <input class="form-check-input" name="ED_Category" #ED_Category="ngModel" [(ngModel)]="a.ED_Category"
          type="radio" id="inlineRadio1" value="F" required> Formula
      </label>
    </div>
  </div>
  <br><br>
  <div class="col-md-6" *ngIf="show1 || (a.ED_Category == 'A')">
    <div class="input-group">
      <div class="input-group-prepend">
        <span class="input-group-text"> ₹ </span>
      </div>
      <input type="number" name="Flat_amt" #Flat_amt="ngModel" [(ngModel)]="a.Flat_amt" class="form-control" required>
    </div>
    <div class="error-msg pull-right" *ngIf="Flat_amt.invalid && (Flat_amt.dirty || Flat_amt.touched || formInvalid)">
      <span *ngIf="Flat_amt.errors.required">Flat amout is required</span>
    </div>
  </div>
  </div>
<div class="row">
  <div class="col-md-6">
    <div class="input-group">
      <label>Mandatory
        <span class="mandatory">*</span>
      </label>
      <select name="Global_ind" #Global_ind="ngModel" [(ngModel)]="a.Global_ind" class="custom-field" required>
        <option selected value="">--Select--</option>
        <option value="Y">Yes</option>
        <option value="N">No</option>
      </select>
    </div>
    <div class="error-msg pull-right"
      *ngIf="Global_ind.invalid && (Global_ind.dirty || Global_ind.touched || formInvalid)">
      <span *ngIf="Global_ind.errors.required">Mandatory field is required</span>
    </div>

  </div>
</div>
    <div class="row">
      <div class=" col-md-6">
        <div class="input-group">
          <label>Mark this as Active
            <span class="mandatory">*</span>
          </label>
          <select name="ACTIVE_IND" #ACTIVE_IND="ngModel"
          [(ngModel)]="a.ACTIVE_IND" class="custom-field" required>
            <option value="">--Select--</option>         
            <option value="N">No</option>
            <option value="Y">Yes</option>
          </select> 
        </div>
        <div class="error-msg pull-right"  *ngIf="ACTIVE_IND.invalid && (ACTIVE_IND.dirty || ACTIVE_IND.touched || formInvalid)">
          <span  *ngIf="ACTIVE_IND.errors.required">Mark this as Active field is required</span>             
      </div>
      </div>
      <div class=" col-md-6">
        <div class="input-group">
          <label>Compliance
            <span class="mandatory">*</span>
          </label>
          <select name="Compliance_ind" #Compliance_ind="ngModel"
          [(ngModel)]="a.Compliance_ind" class="custom-field" required>
            <option value="">--Select--</option>         
            <option value="N">No</option>
            <option value="Y">Yes</option>
          </select>
        </div>
        <div class="error-msg pull-right"  *ngIf="Compliance_ind.invalid && (Compliance_ind.dirty || Compliance_ind.touched || formInvalid)">
          <span  *ngIf="Compliance_ind.errors.required">Compliance is required</span>             
      </div>
      </div>
    </div>
  </div>
  <br>
  <div class="text-center">
    <button class="btn btn-primary" type="submit">Save</button> &nbsp;
    <button class="btn btn-primary" (click)="Cancel()">Cancel</button>
  </div>
  </form>
</div>
