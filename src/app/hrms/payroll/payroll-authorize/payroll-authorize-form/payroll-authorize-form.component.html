<div class="wrapper">
  <div class="title themeheading">
    Add Payroll Approval
    <button class="btn btn-primary float-right" [routerLink]="['/home/payroll/payroll-authorize']">Back</button>
    <span class="clearfix"></span>
  </div>
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-4">
        <div class="row" style="margin-top: -10px;">
          <div class="col-md-7">
            <label for="">Leave Application No. : </label>
          </div>
          <div class="col-md-5">
            <span> </span>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="row" style="margin-top: -10px;">
          <div class="col-md-5">
            <label for="">Date : </label>
          </div>
          <div class="col-md-7">
            <span> </span>
          </div>
        </div>
      </div>
      <div class=" col-md-4">
        <div class="row" style="margin-top: -10px;">
          <div class="col-md-5">
            <label for="">Status : </label>
          </div>
          <div class="col-md-7">
            <span> <span>Pending</span> </span>
          </div>
        </div>
      </div>
    </div>
    <div class="title themeheading rowmarginfix">
      Employee Details
      <span class="clearfix"></span>
    </div>

    <div class="row">
      <div class="col-md-4">
        <div class="input-group">
          <label for=""> Division code </label>
          <select class="custom-field">
            <option selected>---Select---</option>
          </select>
        </div>
      </div>
      <div class="col-md-4">
        <div class="input-group">
          <label for="">Emp Code </label>
          <select class="custom-field">
            <option>---Select---</option>
          </select>
        </div>
      </div>
      <div class="col-md-4">
        <label for="">Name : </label> &nbsp;
        <span> </span>
      </div>
    </div>
    <div class="row">
      <div class="col-md-4 ">
        <label for="">Division : </label> &nbsp;
        <span> </span>
      </div>
      <div class="col-md-4">
        <label for="">Department : </label> &nbsp;
        <span> </span>
      </div>
      <div class="col-md-4">
        <label for="">Designation : </label> &nbsp;
        <span> </span>
      </div>
    </div>
    <div class="row">
      <div class="col-md-4">
        <label for="">Employee Category : </label> &nbsp;
        <span> </span>
      </div>
      <div class="col-md-4">
        <label for="">Employee Group : </label> &nbsp;
        <span> </span>
      </div>
      <div class="col-md-4">
        <label for="">Employee Type : </label> &nbsp;
        <span> </span>
      </div>
    </div>

    <div class="title themeheading rowmarginfix">
      Approval Details
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="form-inline">
          <div class="form-group mb-2">
            <label for="" style="color: blue;">Authorzed : </label>
          </div>
          <div class="form-group mx-sm-3 mb-2">
            <input type="radio" class="form-control" id="radio1" name="exampleRadios1">
            <label for="radio1">Yes</label>
          </div>
          <div class="form-group mx-sm-3 mb-2">
            <input type="radio" class="form-control" id="radio2" name="exampleRadios1">
            <label for="radio2">No</label>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-inline">
          <div class="form-group mb-2">
            <label for="" style="color: blue;">Cancel : </label>
          </div>
          <div class="form-group mx-sm-3 mb-2">
            <input type="radio" class="form-control" id="radio3" name="exampleRadios2">
            <label for="radio3">Yes</label>
          </div>
          <div class="form-group mx-sm-3 mb-2">
            <input type="radio" class="form-control" id="radio4" name="exampleRadios2">
            <label for="radio4">No</label>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <label for="">Authorzed By :</label>
      </div>
      <div class="col-md-6">
        <label for="">Authorzed Date :</label>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <label for="">Canceled By :</label>
      </div>
      <div class="col-md-6">
        <label for="">Canceled Date :</label>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="input-group">
          <label for="">Remarks</label>
          <textarea name="" id="" cols="30" rows="10" class="custom-field"></textarea>
        </div>
      </div>
    </div>
  </div>
  <br>
  <div class="text-center">
    <button class="btn btn-primary">Save</button> &nbsp;
    <button class="btn btn-primary">Cancel</button>
  </div>
</div>
