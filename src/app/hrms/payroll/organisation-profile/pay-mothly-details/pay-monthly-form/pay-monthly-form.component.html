<div class="wrapper">
  <div class="title themeheading ">
    Pay Months Details
    <button class="btn btn-primary float-right" [routerLink]="['/home/payroll/payroll-compliance/pay-monthly']">Back</button>
  </div>
  <!-- <div class="title themeheading">
    Attendance Details
    <span class="clearfix"></span>
  </div> -->

    <div class="col-md-3">

  </div>
  </div>
