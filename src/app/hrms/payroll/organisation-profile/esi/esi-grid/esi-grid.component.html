<div class="wrapper">
  <br>
  <div class="container">
    <div class="row">
      <div class="col-md-2">
        <label for="">Enable / Disable</label>
      </div>
      <div class="col-md-2">
        <label class="switch">
          <input type="checkbox" (click)="toggle1()">
          <span class="slider round"></span>
        </label>
      </div>
    </div>
  </div>

  <br>
  <span *ngIf="show1">
    <div class="title themeheading">
      Employees' State Insurance
      <a class="btn btn-change float-right" routerLink="/home/payroll/esi/esi-form">Edit</a>
      <span class="clearfix"></span>
    </div>
    <br>
    <div class="container-fluid">
      <div class="row justify-content-center">
        <div class="col-md-3">
          <label for="">ESI Number</label>
        </div>
        <div class="col-md-6">
          <span>-</span>
        </div>
      </div>
      <div class="row justify-content-center">
        <div class="col-md-3">
          <label for="">Deduction Cycle</label>
        </div>
        <div class="col-md-6">
          <span>Monthly</span>
        </div>
      </div>
      <div class="row justify-content-center">
        <div class="col-md-3">
          <label for="">Employees' Contribution</label>
        </div>
        <div class="col-md-6">
          <span>0.75% of Gross Pay</span>
        </div>
      </div>
      <div class="row justify-content-center">
        <div class="col-md-3">
          <label for="">Employer's Contribution</label>
        </div>
        <div class="col-md-6">
          <span>3.25% of Gross Pay</span>
        </div>
      </div>
    </div>
  </span>


</div>
