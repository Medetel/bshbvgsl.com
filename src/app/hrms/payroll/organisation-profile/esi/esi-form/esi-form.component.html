<div class="wrapper">
  <div class="title themeheading">
    Employees' State Insurance
    <a class="btn btn-change float-right" [routerLink]="['/home/payroll/esi']">Back</a>
    <span class="clearfix"></span>
  </div>

  <div class="container-fluid">
    <div class="row ">
      <div class="col-md-6">
        <div class="input-group">
          <label for="">EPF Number</label>
          <input type="text" class="custom-field">
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label for="">Deduction Cycle : </label> 
          <span>Monthly</span>
        </div>
      </div>
    </div>

    <div class="row ">
      <div class="col-md-4">
        <div class="input-group">
          <label for="">Employer Contribution Rate</label>
          <input type="text" class="form-control">
          <div class="input-group-append">
            <span class="input-group-text" id="basic-addon2">%</span>
          </div>           
        </div>
      </div>
      <div class="col-md-4">
        <div class="input-group">
          <label for="">Employee Contribution Rate</label>
          <input type="text" class="form-control">
          <div class="input-group-append">
            <span class="input-group-text" id="basic-addon2">%</span>
          </div>  
        </div>
      </div>
      <div class="col-md-4">
        <div class="input-group">
          <label for="">EPS Max. Wages</label>
          <div class="input-group-prepend">
            <span class="input-group-text" id="basic-addon1">₹</span>
          </div>
          <input type="text" class="form-control">
        </div>
      </div>
    </div>
    
    <div class="row">
      <div class="col-md-6">
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" id="inlineCheckbox1" value="option1">
          <label class="form-check-label" for="inlineCheckbox1">Include employer's contribution in the CTC</label>
        </div>
      </div>      
    </div>    
    <br>
    <div class="text-center">
      <button class="btn btn-change">Save</button> &nbsp;
      <button class="btn btn-change" [routerLink]="['/home/master/statutory-component']">Cancel</button>
    </div>
  </div>
  <br>
</div>
