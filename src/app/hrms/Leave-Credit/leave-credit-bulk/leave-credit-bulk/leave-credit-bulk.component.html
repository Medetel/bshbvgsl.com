<div class="wrapper">
  <form #searchForm="ngForm" (ngSubmit)="onSearch(searchForm,itemsPerPage,1)">
    <div class="title themeheading">{{title}}
      <div class="float-right">
        Items per page:
        <select name="SearchRows" #SearchRows="ngModel" [(ngModel)]="itemsPerPage" class="noofpage"
          (change)="itemsPerPageChanged(itemsPerPage, 1)">
          <option [ngValue]="5">5</option>
          <option [ngValue]="10">10</option>
          <option value="20">20</option>
          <option value="30">30</option>
          <option value="40">40</option>
          <option value="50">50</option>
        </select>
        <a class="btn btn-primary " [routerLink]="['/home/leavecredit/leave-credit-bulk-form']">Generate</a>
      </div>
      <span class="clearfix"></span>
    </div>
    <div class="searchbar">
      <div class="container">
        <div class="row">
          <div class="col-md-1">
            <label>Search</label>
          </div>
          <div class="col-md-4">
            <select name="SearchCriteria" class="form-control" required>
              <option [ngValue]="undefined" selected>---Select---</option>
              <option value="">Division Code</option>
              <option value="">Department Code</option>
              <option value="">Employee Id</option>
              <option value="">Employee Name</option>
              <option value="">Document No </option>
              <option value="">Document Date</option>
              <option value="">Document Status</option>
              <option value="">Calendar Year</option>
              <option value="">Finalized</option>
              <option value="">Draft</option>
            </select>
          </div>
          <div class="col-md-4">
            <input type="text" name="SearchText" class="form-control" placeholder="Search.." required>
          </div>
          <div class="col-md-3">
            <button class="btn btn-default" type="submit">Search</button>
            <button class="btn btn-default" type="reset" >Clear</button>
          </div>
        </div>
      </div>
    </div>
    <div class="table-responsive">
      <table class="table table-striped grid">
          <thead>
              <tr>
                  <td>Sl No.</td>
                  <td>Leave Credit No</td>            
                 
                  <td>Leave Type</td>
                  <td>Credit Leaves</td>  
                  <td>Status</td>                 
                  <td class="text-center">View</td>
                  <!-- <td class="text-center">Edit</td>
                  <td class="text-center">Delete</td> -->
              </tr>
          </thead>
          <tbody>
              <tr *ngFor="let l of Leavecreditdetails; let i=index">
                  <td>{{i+1}}</td>
                  <td>{{l.DOC_CODE}}</td>               
          
                  <td>{{l.leave_name}}</td>
                  <td>{{l.Leave_Credi}}</td>   
                  <td>{{l.DOC_STATUS}}</td>               
                  <td class="text-center">
                      <a href="#" [routerLink]="['/home/leavecredit/leave-credit-bulk-form',l.LEAVE_CREDIT_ID,'view']">
                          <i class="fa fa-lg fa-eye themecolor"></i>
                      </a>
               </td>
                  <!-- <td class="text-center">
                      <a href="javascript:void(0);">
                          <i class="fa fa-lg fa-edit themecolor"></i>
                      </a>
                  </td>
                  <td class="text-center">
                      <a href="javascript:void(0);">
                          <i class="fa fa-lg fa-trash themecolor"></i>
                      </a>
                  </td> -->
              </tr>
          </tbody>
      </table>
  </div>
  </form>
</div>
