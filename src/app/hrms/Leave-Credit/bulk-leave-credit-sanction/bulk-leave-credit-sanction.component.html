<div class="wrapper">
  <form #searchForm="ngForm" (ngSubmit)="onSearch(searchForm,itemsPerPage,1)">
    <div class="title themeheading">{{title}}
      <div class="float-right">
        Items per page:
        <select name="SearchRows" #SearchRows="ngModel" [(ngModel)]="itemsPerPage" class="noofpage"
          (change)="itemsPerPageChanged(itemsPerPage, 1)">
          <option [ngValue]="5">5</option>
          <option [ngValue]="10">10</option>
          <option value="20">20</option>
          <option value="30">30</option>
          <option value="40">40</option>
          <option value="50">50</option>
        </select>

      </div>
      <span class="clearfix"></span>
    </div>
    <div class="searchbar">
      <div class="container">
        <div class="row">
          <div class="col-md-1">
            <label>Search</label>
          </div>
          <div class="col-md-4">
            <select name="SearchCriteria" class="form-control" required>
              <option [ngValue]="undefined" selected>---Select---</option>
              <option value="">Division Code</option>
              <option value="">Department Code</option>
              <option value="">Employee Id</option>
              <option value="">Employee Name</option>
              <option value="">Document No </option>
              <option value="">Document Date</option>
              <option value="">Document Status</option>
              <option value="">Calendar Year</option>
              <option value="">Finalized</option>
              <option value="">Draft</option>
            </select>
          </div>
          <div class="col-md-4">
            <input type="text" name="SearchText" class="form-control" placeholder="Search.." required>
          </div>
          <div class="col-md-3">
            <button class="btn btn-default" type="submit">Search</button>
            <button class="btn btn-default" type="reset">Clear</button>
          </div>
        </div>
      </div>
    </div>
    <br>
    <br>

    <div class="container-fluid">
      <div class="row">
        <div class="col-md-6">
          <div class="input-group">
            <label for=""> Division </label>
            <select class="custom-field" [(ngModel)]="c.DIVISION_CODE" #DIVISION_CODE="ngModel" name="DIVISION_CODE"
              (change)="ChangeOfDivision(c.DIVISION_CODE)">
              <option [value]="undefined" selected>---Select---</option>
              <option [value]=0>All</option>
              <option [value]="d.DI_Id" *ngFor="let d of DistrictsList;">
                {{d.DI_District}}
              </option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="table-responsive" id="auction-grid">
      <table class="table table-striped table-bordered">
        <thead>
          <tr>
            <td rowspan="2">Sl No.</td>
            <td rowspan="2">Leave Credit No.</td>
            <td colspan="3" class="text-center">Employee Details</td>
            <td colspan="4" class="text-center">Sanction/Rejection Procedure </td>
          </tr>
          <tr>
            <td>leave type</td>
            <td>cedit leaves</td>

            <td>Status</td>
            <td>Sanction</td>
            <td>Reject</td>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let l of Leavecreditdetails; let i=index">
            <td>{{i+1}}</td>
            <td>{{l.DOC_CODE}}</td>
            <td>{{l.leave_name}}</td>
            <td>{{l.Leave_Credi}}</td>           
            <td>{{l.DOC_STATUS}}</td>

            <td>
              <div class="form-check form-check-inline">
                <input class="form-check-input" data-toggle="modal" data-target=".bd-example-modal-lg1"
                  (change)="handleChange2(l.LEAVE_CREDIT_ID)" type="radio" name="inlineRadioOptions" id="inlineRadio1"
                  value="option1">
                <label class="form-check-label" for="inlineRadio1">Sanction</label>
              </div>
            </td>
            <td>
              <div class="form-check form-check-inline">
                <input class="form-check-input" data-toggle="modal" data-target=".bd-example-modal-lg2"
                  (change)="handleChange1(l.LEAVE_CREDIT_ID)" type="radio" name="inlineRadioOptions" id="inlineRadio2"
                  value="option2">
                <label class="form-check-label" for="inlineRadio2">Reject</label>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </form>
</div>

<div class="modal fade bd-example-modal-lg1" tabindex="-1" role="dialog" aria-labelledby="myLargeModalLabel"
  aria-hidden="true">
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Sanction</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="">Remarks</label>
          <textarea name="" id="" cols="30" rows="5" class="form-control"></textarea>
        </div>

      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" data-dismiss="modal" (click)="save(a.remarks)">Save</button>
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
<div class="modal fade bd-example-modal-lg2" tabindex="-1" role="dialog" aria-labelledby="myLargeModalLabel"
  aria-hidden="true">
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Rejection</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="">Remarks</label>
          <textarea name="" id="" cols="30" [(ngModel)]="a.remarks" rows="5" class="form-control"></textarea>
        </div>

      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" data-dismiss="modal" (click)="save(a.remarks)">Save</button>
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
