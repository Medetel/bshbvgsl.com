<div class="wrapper">
  <div class="title themeheading">
    Add Training Sanction
    <button class="btn btn-primary float-right" [routerLink]="['/home/training/training-sanction']">Back</button>
    <span class="clearfix"></span>
  </div>
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-4">
        <div class="row" style="margin-top: -10px;">
          <div class="col-md-7">
            <label for="">Emp Training No. : </label>
          </div>
          <div class="col-md-5">
            <span> </span>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="row" style="margin-top: -10px;">
          <div class="col-md-5">
            <label for="">Date : </label>
          </div>
          <div class="col-md-7">
            <span> </span>
          </div>
        </div>
      </div>
      <div class=" col-md-4">
        <div class="row" style="margin-top: -10px;">
          <div class="col-md-5">
            <label for="">Status : </label>
          </div>
          <div class="col-md-7">
            <span> <span>Pending</span> </span>
          </div>
        </div>
      </div>
    </div>
    <div class="title themeheading rowmarginfix">
      Employee Details
      <span class="clearfix"></span>
    </div>

    <div class="row">
      <div class="col-md-4">
        <div class="input-group">
          <label for=""> Division code </label>
          <select class="custom-field">
            <option selected>---Select---</option>
          </select>
        </div>
      </div>
      <div class="col-md-4">
        <div class="input-group">
          <label for="">Emp Code </label>
          <select class="custom-field">
            <option>---Select---</option>
          </select>
        </div>
      </div>
      <div class="col-md-4">
        <label for="">Name : </label> &nbsp;
        <span> </span>
      </div>
    </div>
    <div class="row">
      <div class="col-md-4 ">
        <label for="">Division : </label> &nbsp;
        <span> </span>
      </div>
      <div class="col-md-4">
        <label for="">Department : </label> &nbsp;
        <span> </span>
      </div>
      <div class="col-md-4">
        <label for="">Designation : </label> &nbsp;
        <span> </span>
      </div>
    </div>
    <div class="row">
      <div class="col-md-4">
        <label for="">Employee Category : </label> &nbsp;
        <span> </span>
      </div>
      <div class="col-md-4">
        <label for="">Employee Group : </label> &nbsp;
        <span> </span>
      </div>
      <div class="col-md-4">
        <label for="">Employee Type : </label> &nbsp;
        <span> </span>
      </div>
    </div>

    <div class="title themeheading rowmarginfix">
      Training Details
    </div>
    <div class="border-view">
      <div class="table-responsive">
        <table class="table table-striped table-bordered">
          <thead>
            <tr>
              <td class="text-center">Sl No.</td>
              <td class="text-center">Training Type</td>
              <td class="text-center">Trainig Category</td>
              <td class="text-center">Registration No</td>
              <td class="text-center">View </td>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="text-center">1.</td>
              <td class="text-center">Internal</td>
              <td class="text-center">Technical</td>
              <td class="text-center">R484798</td>
              <td class="text-center">
                <a href="#">
                  <i class=" fa fa-lg fa-eye themecolor"></i>
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="title themeheading rowmarginfix">
      Sanction Details
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="form-inline">
          <div class="form-group mb-2">
            <label for="" style="color: blue;">Sanctioned : </label>
          </div>
          <div class="form-group mx-sm-3 mb-2">
            <input type="radio" class="form-control" id="radio1" name="exampleRadios1">
            <label for="radio1">Yes</label>
          </div>
          <div class="form-group mx-sm-3 mb-2">
            <input type="radio" class="form-control" id="radio2" name="exampleRadios1">
            <label for="radio2">No</label>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-inline">
          <div class="form-group mb-2">
            <label for="" style="color: blue;">Cancel : </label>
          </div>
          <div class="form-group mx-sm-3 mb-2">
            <input type="radio" class="form-control" id="radio3" name="exampleRadios2">
            <label for="radio3">Yes</label>
          </div>
          <div class="form-group mx-sm-3 mb-2">
            <input type="radio" class="form-control" id="radio4" name="exampleRadios2">
            <label for="radio4">No</label>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <label for="">Sanctioned By :</label>
      </div>
      <div class="col-md-6">
        <label for="">Sanctioned Date :</label>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <label for="">Canceled By :</label>
      </div>
      <div class="col-md-6">
        <label for="">Canceled Date :</label>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="input-group">
          <label for="">Remarks</label>
          <textarea name="" id="" cols="30" rows="10" class="custom-field"></textarea>
        </div>
      </div>
    </div>

  </div>
  <br>
  <div class="text-center">
    <button class="btn btn-primary">Save</button> &nbsp;
    <button class="btn btn-primary">Cancel</button>
  </div>
</div>
