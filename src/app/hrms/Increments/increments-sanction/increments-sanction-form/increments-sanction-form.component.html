<div class="wrapper">
  <div class="title themeheading">
    Add Employee Increment
    <button class="btn btn-primary float-right" [routerLink]="['/home/increment/incr-sanction']">Back</button>
    <span class="clearfix"></span>
  </div>
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-4">
        <label for="">Increment List No :</label>
      </div>
      <div class="col-md-4">
        <label for="">Date : </label>
      </div>
      <div class="col-md-4">
        <label for="">Status :</label>
      </div>
    </div>

    <div class="title themeheading rowmarginfix">
      Generate Increment List
    </div>
    <div class="table-responsive">
      <table class="table table-striped grid">
        <thead>
          <tr>
            <td>Sl No.</td>
            <td>Employee Id</td>
            <td>Employee Name</td>
            <td>Designation</td>
            <td>Pay Scale </td>
            <td>Basic Pay [Before Increment]</td>
            <td>Increment Due Date</td>
            <td>Basic Pay [After Increment] </td>
            <td>Increment W.E.F</td>
            <td>Hold_Ind</td>
            <td>Next Increment Due Date</td>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td> 1 </td>
            <td> 2340 </td>
            <td> Akash</td>
            <td>FDA</td>
            <td>10000-500-12500</td>
            <td>11000</td>
            <td>05-01-2019</td>
            <td>
              <select name="" id="" class="form-control">
                <option value="">--Select--</option>
                <option value="">10500-500-12500</option>
                <option value="">16000-1000-20000</option>
              </select>
            </td>
            <td>
              <select name="" id="" class="form-control">
                <option value="">--Select--</option>
                <option value="">Yes</option>
                <option value="">No</option>
              </select>
            </td>
            <td>
              <input type="date" class="form-control">
            </td>
            <td>
              <input type="date" class="form-control">
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <br>

    <div class="title themeheading rowmarginfix">
      Sanction Details
    </div>

    <div class="row">
      <div class="col-md-6">
        <div class="form-inline">
          <div class="form-group mb-2">
            <label for="" style="color: blue;">Sanctioned : </label>
          </div>
          <div class="form-group mx-sm-3 mb-2">
            <input type="radio" class="form-control" id="radio1" name="exampleRadios1">
            <label for="radio1">Yes</label>
          </div>
          <div class="form-group mx-sm-3 mb-2">
            <input type="radio" class="form-control" id="radio2" name="exampleRadios1">
            <label for="radio2">No</label>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-inline">
          <div class="form-group mb-2">
            <label for="" style="color: blue;">Cancel : </label>
          </div>
          <div class="form-group mx-sm-3 mb-2">
            <input type="radio" class="form-control" id="radio3" name="exampleRadios2">
            <label for="radio3">Yes</label>
          </div>
          <div class="form-group mx-sm-3 mb-2">
            <input type="radio" class="form-control" id="radio4" name="exampleRadios2">
            <label for="radio4">No</label>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <label for="">Sanctioned By :</label>
      </div>
      <div class="col-md-6">
        <label for="">Sanctioned Date :</label>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <label for="">Canceled By :</label>
      </div>
      <div class="col-md-6">
        <label for="">Canceled Date :</label>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="input-group">
          <label for="">Remarks</label>
          <textarea name="" id="" cols="30" rows="10" class="custom-field"></textarea>
        </div>
      </div>
    </div>

    <br>
    <div class="text-center">
      <button class="btn btn-primary">Save</button>
      <button class="btn btn-primary">Process Increment</button>
      <button class="btn btn-primary">Cancel</button>
    </div>
    <br>
  </div>
</div>
