<div class="wrapper">
    <form #searchForm="ngForm" (ngSubmit)="onSearch(searchForm,itemsPerPage,1)">
      <div class="title themeheading">{{title}}
        <div class="float-right">
          Items per page:
          <select name="SearchRows" #SearchRows="ngModel" [(ngModel)]="itemsPerPage" class="noofpage"
            (change)="itemsPerPageChanged(itemsPerPage, 1)">
            <option [ngValue]="5">5</option>
            <option [ngValue]="10">10</option>
            <option value="20">20</option>
            <option value="30">30</option>
            <option value="40">40</option>
            <option value="50">50</option>
          </select>
          <!-- <a class="btn btn-primary " [routerLink]="['/home/increment/increment-form']">Add</a> -->
        </div>
        <span class="clearfix"></span>
      </div>
      <div class="searchbar">
        <div class="container">
          <div class="row">
            <div class="col-md-1">
              <label>Search</label>
            </div>
            <div class="col-md-4">
              <select name="SearchCriteria" class="form-control" required>
                <option [ngValue]="undefined" selected>---Select---</option>
                <option value="">Division Code</option>
                <option value="">Department Code</option>
                <option value="">Employee Id</option>
                <option value="">Employee Name</option>
                <option value="">Document Code</option>
                <option value="">Document Date</option>
                <option value="">Document Status</option>
                <option value="">Increment Due Date</option>
              </select>
  
            </div>
            <div class="col-md-4">
              <input type="text" name="SearchText" class="form-control" placeholder="Search.." required>
  
            </div>
            <div class="col-md-3">
              <button class="btn btn-default" type="submit">Search</button>
              <button class="btn btn-default" type="reset">Clear</button>
            </div>
          </div>
        </div>
      </div>
      <br>
      <br>

      <div class="table-responsive" id="auction-grid">
          <table class="table table-striped table-bordered">
            <thead>
              <tr>
                <td rowspan="2">Sl No.</td>
                <td rowspan="2">Increment Order No.</td>
                <td rowspan="2">Increment Order Date</td>   
                <td colspan="2" class="text-center" >Employee Details</td>
                <td colspan="2" class="text-center">Sanction/Rejection Procedure </td>
              </tr>
              <tr>                
                <td>Status</td>
                <td>View</td>
                <td>Sanction</td>
                <td>Reject</td>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let e of EmployeeList ; let i=index">
                <td>{{i+1}}.</td>
                <td>{{e.IncrementOrderNo}}</td>
                <td>{{e.DOC_DATE |date:'dd/MM/yyyy'}}</td>                
                <td *ngIf="e.STATUS =='G'">Generated</td>
                <td *ngIf="e.STATUS =='A'">Approved</td>
                <td *ngIf="e.STATUS =='R'">Rejected</td>
                <td *ngIf="e.STATUS =='S'">Sanctioned</td>
                <td class="text-center">
                  <a (click)="IncrementView(e.INCREMENT_ID)">
                    <i class="fa fa-lg fa-eye themecolor"></i>
                </a>
                </td>
                <td>
                  <div class="form-check form-check-inline" *ngIf="e.STATUS =='A'">
                    <input class="form-check-input" type="radio" (change)="handleChange2(e.INCREMENT_ID)" name="inlineRadioOptions" id="inlineRadio1" value="option1">
                    <label class="form-check-label" for="inlineRadio1">Sanction</label>
                  </div>
                </td>
                <td>
                  <div class="form-check form-check-inline" *ngIf="e.STATUS =='A'">
                    <input class="form-check-input" data-toggle="modal" (change)="handleChange1(e.INCREMENT_ID)" data-target=".bd-example-modal-xl" type="radio" name="inlineRadioOptions" id="inlineRadio2"
                     value="option2" *ngIf="e.STATUS!='S'">
                    <label class="form-check-label" for="inlineRadio2" *ngIf="e.STATUS!='S'">Reject</label>
                  </div>
                </td>
        
              </tr>
        
    
            </tbody>
          </table>
          <div class="container-fluid">
            <div class="row">
              <div class="col-md-11">
                <pagination-controls class="my-pagination" id="pagination" (pageChange)="pageChanged($event)" maxSize="9"
                  directionLinks="true" autoHide="false" previousLabel="Previous" nextLabel="Next"
                  screenReaderPaginationLabel="Pagination" screenReaderPageLabel="page"
                  screenReaderCurrentLabel="You're on page">
                </pagination-controls>
              </div>
              <div class="col-md-1">
                Total:
                <span>{{totalItems}}</span>
              </div>
            </div>
          </div>
        </div>
   
        <div class="modal fade bd-example-modal-xl" tabindex="-1" role="dialog" aria-labelledby="myExtraLargeModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-xl" role="document">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="exampleModalLabel">Nomination</h5>
              <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="modal-body">
              <div class="container-fluid">
                <div class="row">
                  <div class="col-md-12">
                    <div class="form-group">
                      <label for=""> Remarks </label>
                      <textarea name="" id="" cols="30" rows="10" class="form-control"> </textarea>
                    </div>
                  </div>
                </div>
                <br>
                <div class="text-center">
                  <button class="btn btn-primary" data-dismiss="modal" (click)="save(a.remarks)">Save</button>
                  <button class="btn btn-primary" data-dismiss="modal" aria-label="Close">Close</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      </form>
  </div>
