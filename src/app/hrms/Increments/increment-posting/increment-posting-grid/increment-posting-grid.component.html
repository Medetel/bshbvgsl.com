<div class="wrapper">
    <form #searchForm="ngForm">
      <div class="title themeheading"> View Post Increment
        <div class="float-right">
          Items per page:
          <select name="SearchRows" class="noofpage"
            >
            <option [ngValue]="5">5</option>
            <option [ngValue]="10">10</option>
            <option value="20">20</option>
            <option value="30">30</option>
            <option value="40">40</option>
            <option value="50">50</option>
          </select>
          <!-- <a class="btn btn-primary " [routerLink]="['/home/increment/increment-form']">Add</a> -->
        </div>
        <span class="clearfix"></span>
      </div>
      <div class="searchbar">
        <div class="container">
          <div class="row">
            <div class="col-md-1">
              <label>Search</label>
            </div>
            <div class="col-md-4">
              <select name="SearchCriteria" class="form-control" required>
                <option [ngValue]="undefined" selected>---Select---</option>
                <option value="">Division Code</option>
                <option value="">Department Code</option>
                <option value="">Employee Id</option>
                <option value="">Employee Name</option>
                <option value="">Document Code</option>
                <option value="">Document Date</option>
                <option value="">Document Status</option>
                <option value="">Increment Due Date</option>
              </select>  
            </div>
            <div class="col-md-4">
              <input type="text" name="SearchText" class="form-control" placeholder="Search.." required>  
            </div>
            <div class="col-md-3">
              <button class="btn btn-default" type="submit">Search</button>
              <button class="btn btn-default" type="reset">Clear</button>
            </div>
          </div>
        </div>
      </div>
      <br>
      <div class="container-fluid">
          <div class="row">
            <div class="col-md-6">
              <div class="input-group">
                <label for="">Division</label>
                <select name="" id="" class="custom-field">
                  <option value="">--Select--</option>
                </select>
              </div>
            </div>
            <div class="col-md-6">
              <div class="input-group">
                <label for="">Designation</label>
                <select name="" id="" class="custom-field">
                  <option value="">--Select--</option>
                </select>
              </div>
            </div>
          </div>
        </div>
        <br>


      <div class="table-responsive">
        <table class="table table-striped grid">
          <thead>
            <tr>
                <td>Sl No.</td>
                <td>Increment List No</td>
                <td>Date</td>
                <td>Division</td>
                <td>Designation</td>
                <td>Increment Year</td>
              <td class="text-center">View</td>
              <td class="text-center" >Edit</td>
              <td class="text-center">Delete</td>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td> 1 </td>
              <td></td>
              <td></td>
              <td></td>
              <td></td>
              <td></td>
              
              <td class="text-center">
                <a href="javascript:void(0);">
                  <i class="fa fa-lg fa-eye themecolor"></i>
                </a>
              </td>
              <td class="text-center">
                <a href="javascript:void(0);" [routerLink]="['/home/increment/increment-post-form']" >
                  <i class="fa fa-lg fa-edit themecolor"></i>
                </a>
              </td>
              <td class="text-center">
                <a href="javascript:void(0);">
                  <i class="fa fa-lg fa-trash themecolor"></i>
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </form>
  </div>
