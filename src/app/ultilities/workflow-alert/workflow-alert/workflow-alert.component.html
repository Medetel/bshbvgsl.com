<div class="wrapper">
  <div class="title themeheading">
    Add Workflow
    <button class="btn btn-primary float-right" [routerLink]="['/home/workflow']">Back</button>
    <span class="clearfix"></span>
  </div>
  <form (ngSubmit)="mode=='edit'?onSubmit(WFForm):onSubmit(WFForm)" #WFForm="ngForm">
    <div class="container-fluid">
      <div class="row">
        <div class="col-md-4">
          <div class="input-group">
            <select class="custom-field" [(ngModel)]="WF.AE_From_User" #AE_From_User="ngModel" name="AE_From_User"
              required>
              <option [ngValue]="undefined" selected>--Select--</option>
              <option [value]="user.KHB_UserId" *ngFor="let user of UserList">{{user.UserName}}-{{user.Name}}</option>
            </select>
            <label for="">From User
              <div *ngIf="AE_From_User.invalid && (AE_From_User.dirty || AE_From_User.touched || formSubmitted)" class="error-msg float-right">
                <div *ngIf="AE_From_User.errors.required">From User is required</div>
              </div>
              <span class="clearfix"></span>
            </label>
          </div>
        </div>
        <div class="col-md-8">
          <div class="form-inline">
            <label for="email">Email</label> &nbsp; &nbsp;
            <div class="form-check">
              <label class="form-check-label">
                <input class="form-check-input" type="checkbox" name="email" (click)="selectOne()">
              </label>
            </div>
            <div *ngIf="ShowOne">
              <div class="input-group">
                <input type="text" style="width: 380px" [(ngModel)]="WF.AE_FromEmail_Id" #AE_FromEmail_Id="ngModel"
                  name="AE_FromEmail_Id" class="custom-field">
              </div>
            </div>
            <label for="sms">SMS</label> &nbsp; &nbsp;
            <div class="form-check">
              <label class="form-check-label">
                <input class="form-check-input" type="checkbox" name="sms" (click)="selectTwo()">
              </label>
            </div>
            <div *ngIf="ShowTwo">
              <div class="input-group">
                <input type="text" [(ngModel)]="WF.AE_FromMobileNo" #AE_FromMobileNo="ngModel" name="AE_FromMobileNo"
                  class="custom-field">
              </div>
            </div>
          </div>
        </div>

      </div>

      <div class="row">
        <div class="col-md-4">
          <div class="input-group">
            <select class="custom-field" [(ngModel)]="WF.AE_To_User" #AE_To_User="ngModel" name="AE_To_User" required>
              <option [ngValue]="undefined" selected>--Select--</option>
              <option [value]="user.KHB_UserId" *ngFor="let user of UserList">{{user.UserName}}-{{user.Name}}</option>
            </select>
            <label for="">To User
              <div *ngIf="AE_To_User.invalid && (AE_To_User.dirty || AE_To_User.touched || formSubmitted)" class="error-msg float-right">
                <div *ngIf="AE_To_User.errors.required">To User is required</div>
              </div>
              <span class="clearfix"></span>
            </label>
          </div>
        </div>
        <div class="col-md-8">
          <div class="form-inline">
            <label for="email">Email</label> &nbsp; &nbsp;
            <div class="form-check">
              <label class="form-check-label">
                <input class="form-check-input" type="checkbox" name="email" (click)="selectThree()">
              </label>
            </div>
            <div *ngIf="ShowThree">
              <div class="input-group">
                <input type="text" style="width: 380px" [(ngModel)]="WF.AE_ToEmail_Id" #AE_ToEmail_Id="ngModel" name="AE_ToEmail_Id"
                  class="custom-field">
              </div>
            </div>
            <label for="sms">SMS</label> &nbsp; &nbsp;
            <div class="form-check">
              <label class="form-check-label">
                <input class="form-check-input" type="checkbox" name="sms" (click)="selectFour()">
              </label>
            </div>
            <div *ngIf="ShowFour">
              <div class="input-group">
                <input type="text" [(ngModel)]="WF.AE_ToMobileNo" #AE_ToMobileNo="ngModel" name="AE_ToMobileNo" class="custom-field">
              </div>
            </div>
          </div>
        </div>


      </div>

      <div class="row">
        <div class="col-md-4">
          <div class="input-group">
            <select class="custom-field" [(ngModel)]="WF.AE_Escalate_To_User" #AE_Escalate_To_User="ngModel" name="AE_Escalate_To_User"
              required>
              <option [ngValue]="undefined" selected>--Select--</option>
              <option [value]="user.KHB_UserId" *ngFor="let user of UserList">{{user.UserName}}-{{user.Name}}</option>
            </select>
            <label for="">Escalate To
              <div *ngIf="AE_Escalate_To_User.invalid && (AE_Escalate_To_User.dirty || AE_Escalate_To_User.touched || formSubmitted)" class="error-msg float-right">
                <div *ngIf="AE_Escalate_To_User.errors.required">Escalate To User is required</div>
              </div>
              <span class="clearfix"></span>
            </label>
          </div>
        </div>
        <div class="col-md-8">
          <div class="form-inline">
            <label for="email">Email</label> &nbsp; &nbsp;
            <div class="form-check">
              <label class="form-check-label">
                <input class="form-check-input" type="checkbox" name="email" (click)="selectFive()">
              </label>
            </div>
            <div *ngIf="ShowFive">
              <div class="input-group">
                <input type="text" style="width: 380px" [(ngModel)]="WF.AE_EscToEmail_Id" #AE_EscToEmail_Id="ngModel"
                  name="AE_EscToEmail_Id" class="custom-field">
              </div>
            </div>
            <label for="sms">SMS</label> &nbsp; &nbsp;
            <div class="form-check">
              <label class="form-check-label">
                <input class="form-check-input" type="checkbox" name="sms" (click)="selectSix()">
              </label>
            </div>
            <div *ngIf="ShowSix">
              <div class="input-group">
                <input type="text" [(ngModel)]="WF.AE_EscToMobileNo" #AE_EscToMobileNo="ngModel" name="AE_EscToMobileNo"
                  class="custom-field">
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-4">
          <div class="input-group">
            <input type="text" class="custom-field" [(ngModel)]="WF.AE_Escalate_NumberofDays" #AE_Escalate_NumberofDays="ngModel"
              name="AE_Escalate_NumberofDays">
            <label for="">Escalate No. of days</label>
          </div>
        </div>
      </div>

      <br>
      <div class="text-center">
        <button class="btn btn-primary">Save</button>
        &nbsp; <button class="btn btn-primary">Cancel</button>
      </div>
    </div>
  </form>

</div>
