<div class="wrapper">
    <div class="title themeheading">
        {{title}}
        <button class="btn btn-primary pull-right" [routerLink]="['/home/masters/salary']">Back</button>
        <span class="clearfix"></span>
      </div>
    <div class="container-fluid">              
        <div class="row ">
             <div class="col-md-6 col-sm-offset-2 col-sm-6">
                 <div class="input-group">
                     <label>Salary Code</label><br>
                     <input class="custom-field" type="number" >                    
                 </div>
             </div>  
             <div class="col-md-3 col-sm-offset-2 col-sm-6">
                    <div class="input-group">
                        <label>Status</label><br>
                        <select name="" id="" class="form-control">
                            <option value="">--Select--</option>
                            <option value="">Active</option>
                            <option value="">Inactive</option>
                        </select>             
                    </div>
                </div>      
         </div>

         <div class="row ">            
             <div class="col-md-6 col-sm-offset-2 col-sm-6">
                 <div class="input-group">
                     <label>Description</label><br>
                     <input class="custom-field" type="text" >                    
                 </div>
             </div>        
         </div>
        
    </div>
     <br>
     <div class="text-center">
         <button class="btn btn-primary">Save</button> &nbsp;
         <button class="btn btn-primary">Cancle</button>
     </div> 
</div>
