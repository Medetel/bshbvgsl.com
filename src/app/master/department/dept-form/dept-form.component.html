<div class="wrapper">
  <div class="title themeheading">
    {{title}}
    <button class="btn btn-primary pull-right" [routerLink]="['/home/dept']">Back</button>
  </div>
  <div class="container-fluid">

    <form (ngSubmit)="mode=='edit'?UpdateDepartment(Department):SaveDepartment(Department)" #Department="ngForm" name="#Department">

      <div class="container-fluid">
        <div class="row justify-content-center">
          <div class="col-md-4">
            <!-- <div class="form-group input-group">
              <input type="text" class="form-control custom-field">
              <label for="">District Code</label>
            </div> -->
  
  
            <div class="input-group form-group">
              <input type="text" class="custom-field" name="Department_Code" maxlength="10" [(ngModel)]="d.Department_Code"
                #Department_Code="ngModel" [disabled]="mode=='view'" pattern="^[a-zA-Z0-9 ]*$" required>
              <label for="">Department Code.
                <span class="mandatory">*</span>
              </label>
  
              <div class="error-msg" *ngIf="Department_Code.invalid && (Department_Code.dirty || Department_Code.touched || formInvalid)">
                <span *ngIf="Department_Code.errors.required">Department code is required</span>
                <span *ngIf="Department_Code.errors?.pattern">Only AlphaNumeric should enter</span>
              </div>
            </div>
  
  
          </div>
        </div>
        <div class="row justify-content-center">
          <div class="col-md-4">
            <!-- <div class="form-group input-group">
              <input type="text" class="form-control custom-field">
              <label for="">District</label>
            </div> -->
  
  
  
            <div class="input-group form-group">
              <input type="text" class="custom-field" name="Department_Name" maxlength="50" [(ngModel)]="d.Department_Name"
                #Department_Name="ngModel" [disabled]="mode=='view'" pattern="^[a-zA-Z0-9 ]*$" required>
              <label for="">Department.
                <span class="mandatory">*</span>
              </label>
  
              <div class="error-msg"
                *ngIf="Department_Name.invalid && (Department_Name.dirty || Department_Name.touched || formInvalid)">
                <span *ngIf="Department_Name.errors.required">Department Name is required</span>
                <span *ngIf="Department_Name.errors?.pattern">Only AlphaNumeric should enter</span>
              </div>
            </div>
          </div>
        </div>
        <div class="btn-wrapper text-center">
          <button [disabled]="mode=='view'"class="btn btn-primary" type="submit">Save</button><button [disabled]="mode=='view'" class="btn btn-primary" type="button"  (click)="Cancel()">Cancel</button>
        </div>
      </div>
  
    </form>
  </div>
