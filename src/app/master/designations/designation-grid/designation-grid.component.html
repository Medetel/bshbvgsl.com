<div class="wrapper">
    <form #searchForm="ngForm" (ngSubmit)="onSearch(searchForm,itemsPerPage,1)">
        <div class="title themeheading">{{title}}
            <div class="float-right">
                Items per page:
                <select name="SearchRows" #SearchRows="ngModel" [(ngModel)]="itemsPerPage" class="noofpage" (change)="itemsPerPageChanged(itemsPerPage, 1)">
                    <option [ngValue]="5">5</option>
                    <option [ngValue]="10">10</option>
                    <option value="20">20</option>
                    <option value="30">30</option>
                    <option value="40">40</option>
                    <option value="50">50</option>
                </select>
                <a class="btn btn-primary " [routerLink]="['/home/masters/designation/designation-form']">Add</a>
            </div>
            <span class="clearfix"></span>
        </div>
        <div class="searchbar">
              <div class="container">
                  <div class="row">
                      <div class="col-md-1">
                          <label>Search</label>
                      </div>
                      <div class="col-md-4">
                            <select name="SearchCriteria" #SearchCriteria="ngModel" [(ngModel)]="s.SearchCriteria" class="form-control"required>
                              <option [ngValue]="undefined" selected>---Select---</option>  
                              <option value="Designation Code"> Designation Code </option>
                              <option value="Designation Description"> Designation Description</option>                                              -->
                          </select>
                          <div *ngIf="SearchCriteria.invalid && (SearchCriteria.dirty || SearchCriteria.touched)" class="error-msg">
                              <div *ngIf="SearchCriteria.errors.required">Search criteria is required</div>
                          </div>
                      </div>
                      <div class="col-md-4">
                            <input type="text" name="SearchText" #SearchText="ngModel" [(ngModel)]="s.SearchText"  class="form-control" placeholder="Search.."
                            required>
                          <div *ngIf="SearchText.invalid && (SearchText.dirty || SearchText.touched)" class="error-msg">
                              <div *ngIf="SearchText.errors.required">Search text is required</div>
                          </div>
                      </div>
                      <div class="col-md-3">
                          <button class="btn btn-default" type="submit">Search</button>
                          <button class="btn btn-default" type="reset" (click)="GetAllTest(itemsPerPage)">Clear</button>
                      </div>
                  </div>
              </div>
          </div>
        <div class="table-responsive">
            <table class="table table-striped grid">
                <thead>
                    <tr>
                        <th>Sl No.</th>
                        <th>Designation Code</th>
                        <th>Designation</th>
                        <!-- <th>Status</th> -->
                        <td class="text-center">View</td>
                        <td class="text-center">Edit</td>
                        <td class="text-center">Delete</td>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let d of Designationlist  | paginate: { id: 'pagination',itemsPerPage: itemsPerPage,currentPage: currentPage,totalItems: totalItems }; let i=index">        
                        <td> {{((currentPage-1)*itemsPerPage)+(i+1)}}.</td>  
                        <td>{{d.Dsc_Code}}</td>
                        <td>{{d.Dsc_Name}}</td>  
                        <td class="text-center">
                                <a href="#" [routerLink]="['/home/masters/designation/designation-form',d.Dsc_Id,'View']">
                                    <i class="fa fa-lg fa-eye themecolor"></i>
                                </a>
                        </td>
                        <td class="text-center">

                            <a href="#" [routerLink]="['/home/masters/designation/designation-form',d.Dsc_Id,'Edit']">
                                
                                <i class="fa fa-lg fa-edit themecolor"></i>
                            </a>
                        </td>
                        <td class="text-center">
                        <a href="javascript:void(0);" (click)="DeleteReligionDetails(d.Dsc_Id)">
                                <i class="fa fa-lg fa-trash themecolor"></i>
                        </a>
                            
                        </td>
                    </tr>
                </tbody>
            </table>
            <div class="container-fluid">
                    <div class="row">
                        <div class="col-md-11">
                            <pagination-controls class="my-pagination" id="pagination" (pageChange)="pageChanged($event)" maxSize="9" directionLinks="true"
                                autoHide="false" previousLabel="Previous" nextLabel="Next" screenReaderPaginationLabel="Pagination"
                                screenReaderPageLabel="page" screenReaderCurrentLabel="You're on page">
                            </pagination-controls>
                        </div>
                        <div class="col-md-1">
                            Total - {{ totalItems}}
                        </div>
                    </div>
                </div>
        </div>
    </form>
  </div>
