<div class="wrapper">
    <div class="title themeheading">
        {{title}}
        <button class="btn btn-primary pull-right" [routerLink]="['/home/userprofile']">Back</button>
        <span class="clearfix"></span>
      </div>
      <div class="container">              
          <div class="row justify-content-center">
               <div class="col-md-offset-3 col-md-6 col-sm-offset-2 col-sm-6">
                   <div class="input-group">
                       <label>Year</label><br>
                       <input class="custom-field" type="month" >                    
                   </div>
               </div>        
           </div>

           <div class="row justify-content-center">            
               <div class="col-md-offset-3 col-md-6 col-sm-offset-2 col-sm-6">
                   <div class="input-group">
                       <label>Day Month</label><br>
                       <input class="custom-field" type="month" >                    
                   </div>
               </div>        
           </div>
          <div class="row justify-content-center">            
               <div class="col-md-offset-3 col-md-6 col-sm-offset-2 col-sm-6">
                   <div class="input-group">
                       <label>Holiday Notification</label><br>
                       <input class="custom-field" type="text" >                    
                   </div>
               </div>        
           </div>
         <div class="row justify-content-center">            
               <div class="col-md-offset-3 col-md-6 col-sm-offset-2 col-sm-6">
                   <div class="input-group">
                       <label>Notification Day</label><br>
                       <input class="custom-field" type="date" >                    
                   </div>
               </div>        
           </div>
          <div class="row justify-content-center">            
               <div class="col-md-offset-3 col-md-6 col-sm-offset-2 col-sm-6">
                   <div class="input-group">
                       <label>Holiday Name</label><br>
                       <input class="custom-field" type="text" >                    
                   </div>
               </div>        
           </div>
      </div>
       <br>
       <div class="text-center">
           <button class="btn btn-primary">Save</button> &nbsp;
           <button class="btn btn-primary">Cancle</button>
       </div> 
</div>
