<div class="wrapper">
  <div class="title themeheading">
    {{title}}
    <button class="btn btn-primary float-right" [routerLink]="['/home/qc']">Back</button>
    <span class="clearfix"></span>
  </div>
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-6">
        <div class="input-group"><select class="custom-field"></select><label for="">Project District</label></div>
      </div>
      <div class="col-md-6">
        <div class="input-group"><select class="custom-field"></select><label for="">Project</label></div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="input-group"><input type="text" class="custom-field"><label for="">Phase</label></div>
      </div>
      <div class="col-md-6">
        <div class="input-group"><input type="text" class="custom-field"><label for="">Contractor</label></div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="input-group"><input type="text" class="custom-field"><label for="">Activity/Job</label></div>
      </div>
      <div class="col-md-6">
        <div class="input-group"><input type="text" class="custom-field"><label for="">QC test category</label></div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="input-group"><input type="text" class="custom-field"><label for="">Test Type</label></div>
      </div>
      <div class="col-md-6">
        <div class="input-group"><input type="text" class="custom-field"><label for="">Test Name</label></div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="input-group"><input type="text" class="custom-field"><label for="">Test Date</label></div>
      </div>
      <div class="col-md-6">
        <div class="input-group"><input type="text" class="custom-field"><label for="">Test Location</label></div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="input-group"><textarea class="custom-field"></textarea><label for="">Description</label></div>
      </div>
      <div class="col-md-6">
        <div class="input-group"><input type="text" class="custom-field"><label for="">No. of test conducted</label></div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="input-group"><input type="text" class="custom-field"><label for="">No. of tests failed</label></div>
      </div>
      <div class="col-md-6">
        <div class="input-group"><input type="text" class="custom-field"><label for="">Tested By</label></div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="input-group"><textarea class="custom-field"></textarea><label for="">Remarks</label></div>
      </div>
      <div class="col-md-1">
        <label for="">Status</label>
      </div>
      <div class="col-md-5">
        <div class="form-check-inline">
          <label class="form-check-label">
            <input type="radio" class="form-check-input" name="optradio">Success
          </label>
        </div>
        <div class="form-check-inline">
          <label class="form-check-label">
            <input type="radio" class="form-check-input" name="optradio">Fail
          </label>
        </div>
        </div>
    </div>
    <br>
    <div class="text-center">
      <button class="btn btn-primary">Save</button><button class="btn btn-primary">Cancel</button>
    </div>
  </div>
</div>
