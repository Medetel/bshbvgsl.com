<div class="wrapper">
  <div class="title themeheading">
    {{title}}
    <button class="btn btn-primary float-right" [routerLink]="['/home/pesc']">Back</button>
    <span class="clearfix"></span>
  </div>


  <div class="container-fluid">
    <div class="row">
      <div class="col-md-6">
        <div class="input-group"><select class="custom-field"></select><label for="">Project</label></div>
      </div>
      <div class="col-md-6">
        <div class="input-group"><input type="text" class="custom-field"><label for="">Phase</label></div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="input-group"><input type="text" class="custom-field"><label for="">Contractor</label></div>
      </div>
      <div class="col-md-6">
        <div class="input-group"><input type="text" class="custom-field"><label for="">E&SC No.</label></div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="input-group"><input type="text" class="custom-field"><label for="">E&SC Code</label></div>
      </div>
      <div class="col-md-6">
        <div class="input-group"><textarea class="custom-field"></textarea><label for="">Remarks</label></div>
      </div>
    </div>
    <br>

    <div class="text-center">
      <button class="btn btn-primary">Save</button><button class="btn btn-primary">Cancel</button>
    </div>

  </div>

</div>
