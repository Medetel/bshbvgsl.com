<div class="wrapper">
  <div class="title themeheading">
    {{title}}
    <button class="btn btn-primary float-right" [routerLink]="['/home/contractordoc']">Back</button>
    <span class="clearfix"></span>
  </div>


  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="input-group"><input type="text" class="custom-field"><label for="">Contract Document Code</label></div>
      </div>
      </div>
      <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="input-group"><input type="text" class="custom-field"><label for="">Document</label></div>
      </div>
    </div>
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="input-group"><textarea name="" id="" cols="30" rows="10" class="custom-field"></textarea><label for="">Description</label></div>
      </div>
    </div>
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="input-group"><input type="text" class="custom-field"><label for="">Class/Type</label></div>
      </div>
    </div>
    <div class="row justify-content-center">
      <div class="col-md-1">
        <label for="">Status</label>
      </div>
      <div class="col-md-5">
        <div class="form-check-inline">
          <label class="form-check-label">
            <input type="radio" class="form-check-input" name="optradio">Active
          </label>
        </div>
        <div class="form-check-inline">
          <label class="form-check-label">
            <input type="radio" class="form-check-input" name="optradio">Inactive
          </label>
        </div>
      </div>
    </div>
    <br>
    <div class="text-center"><button class="btn btn-primary">Save</button><button class="btn btn-primary">Cancel</button></div>
  </div>

</div>
