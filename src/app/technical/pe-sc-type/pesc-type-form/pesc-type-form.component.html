<div class="wrapper">
  <div class="title themeheading">
    {{title}}
    <button class="btn btn-primary float-right" [routerLink]="['/home/pesc-type']">Back</button>
    <span class="clearfix"></span>
  </div>


  <div class="container-fluid">
    <div class="row">
      <div class="col-md-6">
        <div class="input-group"><input type="text" class="custom-field"><label for="">E&SC Code</label></div>
      </div>
      <div class="col-md-6">
        <div class="input-group"><textarea class="custom-field"></textarea><label for="">Description</label></div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="input-group"><input type="text" class="custom-field"><label for="">Class / Type</label></div>
      </div>
      <div class="col-md-1">
        <label for="">Status</label>
      </div>
      <div class="col-md-5">
          <div class="form-check-inline">
              <label class="form-check-label">
                <input type="radio" class="form-check-input" name="optradio">Active
              </label>
            </div>
            <div class="form-check-inline">
              <label class="form-check-label">
                <input type="radio" class="form-check-input" name="optradio">Inactive
              </label>
            </div>
      </div>
    </div>

    <br>

    <div class="text-center">
      <button class="btn btn-primary">Save</button><button class="btn btn-primary">Cancel</button>
    </div>

  </div>

</div>
