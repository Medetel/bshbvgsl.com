<div class="wrapper">
  <form #searchForm="ngForm" (ngSubmit)="onSearch(searchForm,itemsPerPage,1)">
    <div class="title themeheading">
      {{title}}
      <div class="float-right">
            Items per page:
            <select name="SearchRows" #SearchRows="ngModel" [(ngModel)]="itemsPerPage" class="noofpage"
                    (change)="itemsPerPageChanged(itemsPerPage, 1)">
                <option [ngValue]="5">5</option>
                <option [ngValue]="10">10</option>
                <option value="20">20</option>
                <option value="30">30</option>
                <option value="40">40</option>
                <option value="50">50</option>
            </select>
            <button class="btn btn-primary" [routerLink]="['schedule-form']">Add</button>
    </div>      
      <span class="clearfix"></span>
    </div>
    <div class="searchbar">
      <div class="container">
          <div class="row">
              <div class="col-md-1">
                  <label>Search</label>
              </div>
              <div class="col-md-4">
                  <select name="SearchCriteria"  class="form-control" #SearchCriteria="ngModel" [(ngModel)]="s.SearchCriteria" required>
                      <option [ngValue]="undefined" selected>---Select---</option>     
                      <option value="PD_Project_Name">Project</option>   
                      <option value="Phase">Phase</option>    
                      <option value="ActivityJob_Cost">Actual Job Cost</option>    
                      <option value="status_name">Status</option>          
                  </select>
                  <div *ngIf="SearchCriteria.invalid && (SearchCriteria.dirty || SearchCriteria.touched)" class="error-msg">
                      <div *ngIf="SearchCriteria.errors.required">Search criteria is required</div>
                  </div>
              </div>
              <div class="col-md-4">
                <input type="text" name="SearchText"  class="form-control" placeholder="Search.." #SearchText="ngModel" [(ngModel)]="s.SearchText"
                required>
                  <div *ngIf="SearchText.invalid && (SearchText.dirty || SearchText.touched)" class="error-msg">
                      <div *ngIf="SearchText.errors.required">Search text is required</div>
                  </div>
              </div>
              <div class="col-md-3">
                  <button class="btn btn-default" type="submit">Search</button>
                  <button class="btn btn-default" type="reset" (click)=" GetAllSchedule(itemsPerPage, 1)">Clear</button>
              </div>
          </div>
      </div>
  </div>
    <div class="table-responsive">
      <table class="table table-striped">
        <thead>
          <tr>
            <td>Sl No.</td>
            <td>Project</td>
            <td>Phase</td>
            <td>Activity/Job Cost</td>
            <td>Status</td>
            <td>View</td>
            <td>Edit</td>
            <td>Delete</td>
          </tr>
        </thead>
        <tbody>
          <tr
            *ngFor="let tl of Schedulelist | paginate: { id: 'pagination',itemsPerPage: itemsPerPage,currentPage: currentPage,totalItems: totalItems}; let i=index">
                  <td>{{((currentPage-1)*itemsPerPage)+(i+1)}}.</td>
                    <td>{{tl.PD_Project_Name}}</td>
                        <td>{{tl.Phase}}</td>
                        <td>{{tl.ActivityJob_Cost}}</td>  
                        <td>{{tl.status_name}}</td>
                        <td>
                            <a href="#" [routerLink]="['/home/schedule/schedule-form',tl.PhaseSchedule_id,'view']">
                                <i class="fa fa-lg fa-eye themecolor"></i>
                            </a>
                        </td>
                        <td>
                            <a href="#" [routerLink]="['/home/schedule/schedule-form',tl.PhaseSchedule_id,'edit']">
                                <i class="fa fa-lg fa-edit themecolor"></i>
                            </a>
                        </td>
                        <td>
                            <a href="javascript:void(0);" (click)="delete(tl.PhaseSchedule_id)">
                                <i class="fa fa-lg fa-trash themecolor"></i>
                            </a>
                        </td>

                    </tr>  
        </tbody>
      </table>
      <div class="container-fluid">
        <div class="row">
            <div class="col-md-11">
                <pagination-controls class="my-pagination" id="pagination" (pageChange)="pageChanged($event)"
                    maxSize="9" directionLinks="true" autoHide="false" previousLabel="Previous" nextLabel="Next"
                    screenReaderPaginationLabel="Pagination" screenReaderPageLabel="page"
                    screenReaderCurrentLabel="You're on page">
                </pagination-controls>
            </div>
            <div class="col-md-1">
                Total:
                <span>{{totalItems}}</span>
            </div>
        </div>
    </div>
    </div>
  </form>
  </div>
